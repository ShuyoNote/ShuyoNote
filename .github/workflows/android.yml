name: Android (build)

# 为什么单开这个 workflow、而且**只手动触发**：
#
# 1. 本机（Windows）目前构建不出 Android —— 卡在"要 Perl 的 OpenSSL 源码构建"与
#    mupdf 那份 Makefile 的 shell/路径假设上（诊断见
#    私有仓库 `shuyonote-sync-server` 的 `docs/android-launch-plan.md` §0.0）。
#    ⚠️ 但原先那句"Linux runner 上这些问题都不存在"**是错的**：那边只是没有**这一组**问题，
#    却有自己的两个（见第 4 条）。真正成立的说法是——Linux runner 自带完整的
#    perl/make/pkg-config，而 mupdf 的 Makefile 本来就是 Unix 假设 ⇒ "CI 出包"不是绕路，
#    而是当前唯一跑得通的路。
#
# 2. 刻意**不挂 tag**：这个 workflow 产出的是**自检包**，不是可分发件。
#    2026-09-13 起它会**用正式密钥签名**（keystore 从 Secrets 取，见「用正式密钥签名 APK」那一步），
#    目的是让 CI 出的包**直接可装到真机上验**——在那之前每验一次都要在本机手工
#    zipalign+apksigner（本轮手工签了三次，这件事本身就是该自动化的判据）。
#    ⚠️ 但**签名 ≠ 可以发版**：这里的包带着 `VITE_TEST_HOOKS=1`（测试钩子），只能用于自检；
#    对外发布仍然走 release.yml（不带钩子）。
#
# 3. 触发方式：手动（Actions 页 Run workflow），或本文件自身被改动时跑一次
#    （这样落地就能立刻验证，不必先要 dispatch 权限）。
#
# 4. 前两次跑各翻出一个**只在 Linux 上暴露**的坑，都不是"换 NDK 版本"能解决的：
#    run #1：OpenSSL 的 `make install_dev` → `aarch64-linux-android-ranlib: not found`（Error 127），
#            因为 NDK 只提供 llvm-ar / llvm-ranlib，没有那种前缀名。修法见 "Pick an NDK" 步骤。
#    run #2：mupdf-sys 的 bindgen **不带 --target**，用宿主 triple 解析 mupdf 头文件，
#            读到宿主 glibc 的 features-time64.h → `bits/wordsize.h` not found。
#            修法见 "给 bindgen 指定 Android target" 步骤。
#    教训：**"换个环境构建"必须真的跑一遍**——原注释里那句"Linux runner 上这些问题都不存在"
#    被实测打脸了：问题确实不一样，但不是"没有"。
#
# 5. run #3 绿了之后、包真的装到真机上（2026-09-13 · HUAWEI Mate 40 / Android 12）才发现的
#    第五个平台差异：**构建能过 ≠ 运行时能用**。boa_engine 的 nan-boxing 在 Android 上
#    不成立（指针最高字节被当 tag 用，而它只留低 48 位），插件线程一上来就 panic：
#      thread 'plugin-run' panicked at boa_engine-.../nan_boxed.rs:270:9
#    修法在 `src-tauri/Cargo.toml` 的移动端依赖段：开 `jsvalue-enum`（枚举版 JsValueInner）。
#    **所以"CI 绿了"只证明能出包，不证明装上能用**——这条 workflow 的价值边界就在这里，
#    真机验收那一步不能省。

on:
  workflow_dispatch:
  push:
    branches: ["dev", "main"]
    paths:
      - ".github/workflows/android.yml"
      # Android 工程是从它**生成**的（应用名、包名、minSdk、**深链 intent-filter**…），
      # 所以改它必须重新出包。漏了这条的话，清单会停在旧版本上，而那种漂移只在真机上才看得出。
      - "src-tauri/tauri.conf.json"
      #
      # ⚠️ 下面这一组是 2026-09-13 补的。补之前**Rust 源码改了根本不触发构建**：
      # 当时改的是 `src-tauri/src/deeplink.rs`（深链接线不再桌面专属），推上去之后
      # Actions 里**连一条运行记录都没有**——只有这个文件自己和 tauri.conf.json 能触发。
      # 这与文件头第 5 条是同一类错误：**"改完会重新出包"这件事本身也要能被验证**，
      # 判据是"推完去 Actions 看有没有新记录"，而不是"我记得它配了"。
      #
      # Rust 侧（整包编进 .so）：
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/src/**"
      - "src-tauri/capabilities/**" # 权限清单进包，`check-capabilities` 也读它
      - "src-tauri/icons/**" # 图标进包
      # 前端侧：`pnpm build` 的产物整包进 APK，而且 build 里串了仓库门禁
      # （check-versions / check-web-commands / check-deep-link / check-capabilities…），
      # 所以门禁脚本本身也算构建输入——改了它照样可能让这一步红。
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    # ⚠️ `VITE_TEST_HOOKS` **必须挂在 job 级**，不能只挂在某一步上。
    #
    # 为什么（**实测踩到的**）：`tauri.conf.json` 里有 `beforeBuildCommand: "pnpm build"`，
    # 所以 `tauri android build` **会再跑一遍前端构建**，而它不继承别的 step 上的 `env:`。
    # 只挂在下面那一步时，**进包的是没有钩子的那份**：APK 装到真机上，深链整条链路都通
    # （Rust 收到 URL ✓、前端也走到了分派 ✓），却弹一句「测试钩子未启用（这是正式构建）」。
    # 表现极具迷惑性——看起来像"深链没打通"，其实是**两个构建里的另一份**在跑。
    #
    # 敢开这个变量，是因为**本 workflow 的产物本来就不是可分发件**（未签名，只用于
    # "构建能不能过 + 体积多大"，见文件头第 2 条）。**正式发版（release.yml）不带它**，
    # 没有它时钩子在分派层直接拒绝、什么也不做（有单测钉着）。
    env:
      VITE_TEST_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        # 首次跑没有收益，但后续每次调试能省十几分钟——这个 workflow 的价值就在于反复量体积。
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK（改用 runner 预装的那份，不再用 setup-android action）
        # ⚠️ 2026-09-15 起 `android-actions/setup-android@v3` **必失败**，而且失败得极具误导性：
        #   它挂在这一步时后面十几步全部 skip，看起来像"我们的代码坏了"。
        #   上游根因有两条（都在该仓库当天/近期的 issue 里）：
        #     ① #537：Google 当天停止提供 `sdkmanager` 的 `tools` 包 ⇒ `Failed to find package 'tools'`；
        #     ② #536：commandlinetools 的下载 URL 变了 ⇒ `Downloading …commandlinetools-linux-<rev>_latest.zip`
        #        直接 404。
        #   两次连续失败（29ad73c / 7cfe95d）都停在同一步、`feae0fd` 还是绿的，时间点与 ① 吻合。
        # ⇒ 改成**用 runner 镜像自带的 SDK**：ubuntu runner 本来就装了 Android SDK + NDK，
        #   `ANDROID_HOME` / `ANDROID_SDK_ROOT` 由镜像设好（见 actions/runner-images 的 Ubuntu2404-Readme）。
        #   好处不只是"少一个会坏的外部依赖"：下面几条断言会把"镜像变了"变成**一句明确的话**，
        #   而不是等 `sdkmanager` 在别处神秘失败。
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "❌ runner 镜像没设 ANDROID_SDK_ROOT/ANDROID_HOME（镜像变了？）"; exit 1; }
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          test -n "$SM" || {
            echo "❌ 找不到预装的 sdkmanager；$SDK/cmdline-tools 下是："
            ls -la "$SDK/cmdline-tools" 2>/dev/null || true
            exit 1
          }
          echo "Android SDK: $SDK"
          echo "sdkmanager: $SM"
          "$SM" --version
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Pick an NDK + 钉死 binutils（**ranlib 那一条是必须的**）
        # 优先用本机验过的那个版本；装不上就退到 runner 上已有的最新一个。
        # **不写死"必须有某一个版本"**：NDK 版本不是这里要验的东西，构建能不能过才是。
        run: |
          set -e
          WANT="29.0.13846066"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$WANT" ]; then
            yes | sdkmanager --install "ndk;$WANT" >/dev/null 2>&1 || echo "装 $WANT 失败，改用已有的"
          fi
          if [ -d "$ANDROID_SDK_ROOT/ndk/$WANT" ]; then
            NDK="$ANDROID_SDK_ROOT/ndk/$WANT"
          else
            NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -n "$NDK" || { echo "runner 上没有任何 NDK，且装不上"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "选用 NDK: $NDK"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "--- bin 里的相关工具 ---"
          ls "$NDKBIN" | grep -E 'ranlib|^llvm-ar$|^llvm-strip$|^llvm-nm$|^aarch64-linux-android[0-9]+-clang$' || true

          # ⚠️ 第一次真的跑到 OpenSSL 的 `make install_dev` 才暴露的一处（run #1 的红灯）：
          #    /bin/sh: 1: aarch64-linux-android-ranlib: not found
          #    make: *** [Makefile:2797: install_dev] Error 127
          # 原因是 NDK **只**提供 llvm-ar / llvm-ranlib，**没有** `aarch64-linux-android-ranlib`
          # 这种前缀名（NDK 29 实测：带前缀的只有 aarch64-linux-androidNN-clang[++]）；
          # 而 openssl-src 把 RANLIB 设成 cc crate 给的**前缀名**（裸名字，靠 PATH 找）。
          # 注意这不是"换 NDK 版本"能解决的——它是现代 NDK 的结构性事实。
          # 两条一起给：① 让 cc 直接拿到绝对路径；② 再放一组前缀名 wrapper 兜底（PATH 上只有
          # 这 4 个名字，不会影响宿主侧编译）。
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=$NDKBIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDKBIN/llvm-ar"
          } >> "$GITHUB_ENV"
          WRAP="$RUNNER_TEMP/ndk-bin"
          mkdir -p "$WRAP"
          for pair in ar:llvm-ar ranlib:llvm-ranlib strip:llvm-strip nm:llvm-nm; do
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$NDKBIN/${pair#*:}" > "$WRAP/aarch64-linux-android-${pair%%:*}"
            chmod +x "$WRAP/aarch64-linux-android-${pair%%:*}"
          done
          echo "$WRAP" >> "$GITHUB_PATH"
          echo "已就绪：$WRAP/{ar,ranlib,strip,nm}"

      - name: 给 bindgen 指定 Android target + NDK sysroot（mupdf-sys 要用）
        # run #2 的红灯。read 过 mupdf-sys 0.8.0 的 build.rs 才敢下这个结论：
        # 它的 find_clang_sysroot() 只给 **emscripten** 返回 sysroot，别的 target 一律
        # `Ok(None)`，而 generate_bindings() 里除了 sysroot 之外**从不传 --target**。
        # 于是 bindgen 拿**宿主** triple 去解析 mupdf/fitz.h，读到宿主 glibc 的头：
        #   /usr/include/features-time64.h:20:10: fatal error: 'bits/wordsize.h' file not found
        # 而 features-time64.h / bits/wordsize.h 都是 glibc 专有，Android 的 bionic 里根本没有
        # （NDK sysroot 实测：usr/include/bits 有 42 个文件，但没有 wordsize.h）——
        # 所以这条**不是"缺头文件"，是"指错了 target"**。
        #
        # bindgen 唯一的口子就是 BINDGEN_EXTRA_CLANG_ARGS_<TARGET>（README：按 target 区分、
        # 优先级高于不带后缀的那个）。这里从这个口子把 target 与 sysroot 递进去。
        # 两个拼写都写（bindgen 两种都认）；**不设通用那个**，免得影响宿主侧 build script。
        #
        # 本机已用 NDK clang 按同一组参数试编过 <time.h>/<stdint.h>/<sys/types.h> 等，exit=0，
        # 证明这套参数自足、不依赖宿主 glibc。
        run: |
          set -e
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -d "$SYSROOT/usr/include" || { echo "找不到 NDK sysroot: $SYSROOT"; exit 1; }
          ARGS="--target=aarch64-linux-android24 --sysroot=$SYSROOT -isystem $SYSROOT/usr/include -isystem $SYSROOT/usr/include/aarch64-linux-android"
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=$ARGS"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=$ARGS"
          } >> "$GITHUB_ENV"
          echo "BINDGEN args = $ARGS"

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend + 跑门禁
        # 顺带把仓库现有的门禁在 Linux 上也跑一遍（check:ocr-assets 之类），
        # 让"门禁在 Linux 上过不过"早一步暴露（真正的失败点通常还在后面的 Rust 构建）。
        #
        # ⚠️ **这一步的 `dist/` 不是最终进包的那份**：`tauri android build` 会按
        # `tauri.conf.json` 的 `beforeBuildCommand` **再跑一遍 `pnpm build`**。
        # 所以 `VITE_TEST_HOOKS` 挂在 job 级（见上），只挂这里会做出两份不一致的产物。
        run: pnpm build

      - name: Init Android project
        # ⚠️ `src-tauri/gen` 在 .gitignore 里（"可重建"），所以 CI 必须自己 init。
        # 也因此：**任何对 gen/android 的手工改动都不可复现**——需要的定制要么脚本化，要么
        # 改成 tauri.conf.json / 平台配置文件里的声明。见上线计划的风险清单。
        run: pnpm tauri android init --ci

      - name: 注入 rustls-platform-verifier 的 JVM 组件
        # 为什么需要：reqwest 在 Android 上用它校验证书，而它的 Android 后端要回调 JVM 里
        # 的 `org.rustls.platformverifier.CertificateVerifier`；那个 Kotlin 组件**不在
        # Maven Central 上**（rustls-platform-verifier#115），只能引 crate 自带 maven 目录。
        # 为什么是这一步之后：**必须排在 `init` 之后**（gen/ 是刚生成的），而且它改的就是
        # 生成出来的 `app/build.gradle.kts` —— 这正是"gen 定制必须脚本化"那条的落实。
        # 顺带写 Proguard 规则：release 开了 R8，而这些类只被 JNI 按名字用，不 keep 会被删。
        run: pnpm android:platform-verifier

      - name: 注入 Android 壳适配层（窗口 inset 桥 + 返回键）
        # 为什么需要（2026-09-15 真机实测，Mate 40 / Android 12 / 密度 3.0）：
        #   ① 顶部 41 CSS px 是**触摸死区**：状态栏属于 SystemUI 自己的窗口，应用在那一带
        #      收不到触摸（`input tap` 打 y≤123 时 0 个 DOM 事件，y=130 时 100+ 个），
        #      而 targetSdk=36 ⇒ Android 15 起对 SDK≥35 **强制** edge-to-edge，去掉
        #      `enableEdgeToEdge()` 在 15+ 上退不回去 ⇒ 只能真的消费窗口 inset。
        #      而且 **Android 上 env(safe-area-inset-*) 恒为 0**（它取自物理刘海，不是
        #      系统状态栏），实测四个方向都是 0px ⇒ CSS 里写了也没用。
        #   ② 软键盘遮挡底部弹层：edge-to-edge 下系统的 `adjustResize` **是空转的**，
        #      实测键盘弹起后 innerHeight 与 visualViewport.height 都不变 ⇒ web 层
        #      根本察觉不到键盘，键盘高度也只能走同一条 inset 桥（Type.ime()）。
        #   ③ 返回键直接退出应用：`TauriActivity` 关掉了 wry 的回调
        #      （handleBackNavigation = false），Tauri 的 AppPlugin 在"没有 back-button
        #      监听者"时走 finish()。上游的 back-button 逃生口也救不了"退出"这一步——
        #      `plugin:app|exit` 不在 core:app 的权限清单里（有 allow-register-listener，
        #      **没有** allow-exit），ACL 会直接拒 ⇒ 只能由壳层退。
        #      注入的回调先问页面的浮层栈（关掉最上层），栈空才放行退出。
        # 为什么是这一步之后：同样是改 gen/（`MainActivity.kt` 是生成物，不入库）。
        run: pnpm android:mobile-shell

      - name: 自检：壳适配层确实注入了
        # 与 platform-verifier 的 `--check` 同理：这类回归**只有真机看得见**，
        # 所以拦在构建期（缺 inset 桥 ⇒ 顶部又变触摸死区；缺返回键回调 ⇒ 返回键退出应用）。
        run: pnpm check:android-mobile-shell

      - name: 随包 PDFium 库（Android）
        # 为什么需要（2026-09-20 补，P4 的安卓格）：`libpdfium.so` 是 `libloading` **运行时**加载的
        # ⇒ 包里没有它时**装完不会立刻报错**，只有用户开 PDF（P5 之后默认走 PDFium）才变成
        # 「找不到 PDFium 动态库」⇒ 界面上是"打不开"。
        # ⚠️ 之前仓库里**没有任何地方提到 jniLibs**（`gen/android` 是 `.gitignore` 的），
        #    所以安卓一直**没有随包库**、PDF 静默退到 pdf.js ⇒ 这两步就是那条缺失的通路，
        #    且必须排在 `init` 之后（jniLibs 目录属于刚生成的 gen/）。
        run: |
          node scripts/fetch-pdfium.mjs android-arm64
          pnpm android:stage-pdfium

      - name: Build APK (arm64, unsigned)
        run: pnpm tauri android build --target aarch64 --apk --ci

      - name: 自检：APK 里**真的带了**随包 PDFium 库（Android）
        # 与 check:macos-bundle / check:linux-bundle 同一族：断言 `lib/<abi>/libpdfium.so` 在包内、
        # 且与 vendor 那份**逐字节相同**（"文件在"和"是同一份字节"是两件事）。
        # 判据的由来：Windows 吃过"装包里没有 pdfium.dll"、macOS 吃过"包里有但位置对不上"。
        run: pnpm check:android-bundle

      - name: 用正式密钥签名 APK（让 CI 出的包直接能装到真机上验）
        # 为什么加这一步：CI 以前出的是**未签名**包，装真机前必须在本机手工
        # zipalign + apksigner —— 本轮就手工签了三次，还漏签过一次（装的时候报
        # INSTALL_PARSE_FAILED_NO_CERTIFICATES）。签名材料走 Secrets，
        # **指纹核对放在同一步里**，于是"这个包是谁签的"在 CI 上就能程序化判定，
        # 不靠人眼比对（指纹本身不是秘密，可以入库，见 keystore 目录的 README）。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          EXPECT=6ee89e6f0f9326a40d3eac48b520c470d3fb6a7111a94fbe606510b489457a88
          for v in KS_B64 KS_PASS KS_ALIAS; do
            test -n "${!v}" || { echo "❌ 缺少 Secret：$v（名字见 ~/.shuyonote-release-keystore/README-必读.md）"; exit 1; }
          done
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | sort | head -1)
          test -n "$IN" || { echo "❌ 找不到未签名 APK"; exit 1; }
          echo "输入: $IN"
          OUT="$RUNNER_TEMP/shuyonote-aarch64-signed.apk"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "env:KS_PASS" --key-pass "env:KS_PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          echo "===== 签名自查 ====="
          "$BT/apksigner" verify --print-certs "$OUT" | tee "$RUNNER_TEMP/certs.txt"
          GOT=$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "实测指纹: $GOT"
          echo "期望指纹: $EXPECT"
          test "$GOT" = "$EXPECT" || { echo "❌ 签名指纹对不上：这个包不是正式密钥签的"; exit 1; }
          echo "✅ 指纹一致（正式密钥 shuyonote）"
          ls -l "$OUT"

      - name: 报告产物体积（**这正是这个 workflow 存在的理由**）
        run: |
          set -e
          echo "===== 产出的安装包 ====="
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%10s  %p\n' | sort -n
          APK=$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -1)
          test -n "$APK" || { echo "没有产出 APK"; exit 1; }
          echo
          echo "===== APK 内部构成（未压缩体积）====="
          echo "APK: $APK  大小: $(du -h "$APK" | cut -f1)"
          python3 - "$APK" <<'PY'
          import sys, zipfile, collections
          z = zipfile.ZipFile(sys.argv[1])
          groups = collections.Counter()
          files = collections.Counter()
          for i in z.infolist():
              top = i.filename.split('/')[0] + ('/' if '/' in i.filename else '')
              groups[top] += i.file_size
              files[top] += 1
          total = sum(groups.values())
          for k, v in groups.most_common(12):
              print(f"  {v/1048576:10.1f} MiB  {files[k]:5d} 个  {k}")
          print(f"  {total/1048576:10.1f} MiB  合计（未压缩）")
          # 语言包应当不在包里（2026-09-13 起改为按需下载）；这条顺手在 CI 上把守住。
          bad = [i.filename for i in z.infolist() if 'traineddata' in i.filename]
          print("  OCR 语言包是否随包分发:", "是（不该）" if bad else "否 ✅")
          if bad: sys.exit(1)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-aarch64-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload 已签名 APK（可直接 adb install）
        # 单独一个 artifact：未签名那份留着量体积，这份是拿来装机的。
        # 名字里写明 **test-hooks**，避免以后有人把它当发版件拿走。
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-aarch64-signed-test-hooks
          path: ${{ runner.temp }}/shuyonote-aarch64-signed.apk
          if-no-files-found: error
          retention-days: 14
