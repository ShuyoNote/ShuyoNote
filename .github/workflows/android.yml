name: Android (build)

# 为什么单开这个 workflow、而且**只手动触发**：
#
# 1. 本机（Windows）目前构建不出 Android —— 卡在"要 Perl 的 OpenSSL 源码构建"与
#    mupdf 那份 Makefile 的 shell/路径假设上（诊断见
#    私有仓库 `shuyonote-sync-server` 的 `docs/android-launch-plan.md` §0.0）。
#    ⚠️ 但原先那句"Linux runner 上这些问题都不存在"**是错的**：那边只是没有**这一组**问题，
#    却有自己的两个（见第 4 条）。真正成立的说法是——Linux runner 自带完整的
#    perl/make/pkg-config，而 mupdf 的 Makefile 本来就是 Unix 假设 ⇒ "CI 出包"不是绕路，
#    而是当前唯一跑得通的路。
#
# 2. 刻意**不挂 tag**：Android 还没有签名流程，产出的 APK 是**未签名**的、只用于
#    "构建能不能过 + 体积到底多大"这两件事，不是可分发件。
#    等签名与发布流程定了，再决定要不要并进 release.yml。
#
# 3. 触发方式：手动（Actions 页 Run workflow），或本文件自身被改动时跑一次
#    （这样落地就能立刻验证，不必先要 dispatch 权限）。
#
# 4. 前两次跑各翻出一个**只在 Linux 上暴露**的坑，都不是"换 NDK 版本"能解决的：
#    run #1：OpenSSL 的 `make install_dev` → `aarch64-linux-android-ranlib: not found`（Error 127），
#            因为 NDK 只提供 llvm-ar / llvm-ranlib，没有那种前缀名。修法见 "Pick an NDK" 步骤。
#    run #2：mupdf-sys 的 bindgen **不带 --target**，用宿主 triple 解析 mupdf 头文件，
#            读到宿主 glibc 的 features-time64.h → `bits/wordsize.h` not found。
#            修法见 "给 bindgen 指定 Android target" 步骤。
#    教训：**"换个环境构建"必须真的跑一遍**——原注释里那句"Linux runner 上这些问题都不存在"
#    被实测打脸了：问题确实不一样，但不是"没有"。
#
# 5. run #3 绿了之后、包真的装到真机上（2026-09-13 · HUAWEI Mate 40 / Android 12）才发现的
#    第五个平台差异：**构建能过 ≠ 运行时能用**。boa_engine 的 nan-boxing 在 Android 上
#    不成立（指针最高字节被当 tag 用，而它只留低 48 位），插件线程一上来就 panic：
#      thread 'plugin-run' panicked at boa_engine-.../nan_boxed.rs:270:9
#    修法在 `src-tauri/Cargo.toml` 的移动端依赖段：开 `jsvalue-enum`（枚举版 JsValueInner）。
#    **所以"CI 绿了"只证明能出包，不证明装上能用**——这条 workflow 的价值边界就在这里，
#    真机验收那一步不能省。

on:
  workflow_dispatch:
  push:
    branches: ["dev", "main", "feat/android-mobile"]
    paths: [".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        # 首次跑没有收益，但后续每次调试能省十几分钟——这个 workflow 的价值就在于反复量体积。
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pick an NDK + 钉死 binutils（**ranlib 那一条是必须的**）
        # 优先用本机验过的那个版本；装不上就退到 runner 上已有的最新一个。
        # **不写死"必须有某一个版本"**：NDK 版本不是这里要验的东西，构建能不能过才是。
        run: |
          set -e
          WANT="29.0.13846066"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$WANT" ]; then
            yes | sdkmanager --install "ndk;$WANT" >/dev/null 2>&1 || echo "装 $WANT 失败，改用已有的"
          fi
          if [ -d "$ANDROID_SDK_ROOT/ndk/$WANT" ]; then
            NDK="$ANDROID_SDK_ROOT/ndk/$WANT"
          else
            NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -n "$NDK" || { echo "runner 上没有任何 NDK，且装不上"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "选用 NDK: $NDK"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "--- bin 里的相关工具 ---"
          ls "$NDKBIN" | grep -E 'ranlib|^llvm-ar$|^llvm-strip$|^llvm-nm$|^aarch64-linux-android[0-9]+-clang$' || true

          # ⚠️ 第一次真的跑到 OpenSSL 的 `make install_dev` 才暴露的一处（run #1 的红灯）：
          #    /bin/sh: 1: aarch64-linux-android-ranlib: not found
          #    make: *** [Makefile:2797: install_dev] Error 127
          # 原因是 NDK **只**提供 llvm-ar / llvm-ranlib，**没有** `aarch64-linux-android-ranlib`
          # 这种前缀名（NDK 29 实测：带前缀的只有 aarch64-linux-androidNN-clang[++]）；
          # 而 openssl-src 把 RANLIB 设成 cc crate 给的**前缀名**（裸名字，靠 PATH 找）。
          # 注意这不是"换 NDK 版本"能解决的——它是现代 NDK 的结构性事实。
          # 两条一起给：① 让 cc 直接拿到绝对路径；② 再放一组前缀名 wrapper 兜底（PATH 上只有
          # 这 4 个名字，不会影响宿主侧编译）。
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=$NDKBIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDKBIN/llvm-ar"
          } >> "$GITHUB_ENV"
          WRAP="$RUNNER_TEMP/ndk-bin"
          mkdir -p "$WRAP"
          for pair in ar:llvm-ar ranlib:llvm-ranlib strip:llvm-strip nm:llvm-nm; do
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$NDKBIN/${pair#*:}" > "$WRAP/aarch64-linux-android-${pair%%:*}"
            chmod +x "$WRAP/aarch64-linux-android-${pair%%:*}"
          done
          echo "$WRAP" >> "$GITHUB_PATH"
          echo "已就绪：$WRAP/{ar,ranlib,strip,nm}"

      - name: 给 bindgen 指定 Android target + NDK sysroot（mupdf-sys 要用）
        # run #2 的红灯。read 过 mupdf-sys 0.8.0 的 build.rs 才敢下这个结论：
        # 它的 find_clang_sysroot() 只给 **emscripten** 返回 sysroot，别的 target 一律
        # `Ok(None)`，而 generate_bindings() 里除了 sysroot 之外**从不传 --target**。
        # 于是 bindgen 拿**宿主** triple 去解析 mupdf/fitz.h，读到宿主 glibc 的头：
        #   /usr/include/features-time64.h:20:10: fatal error: 'bits/wordsize.h' file not found
        # 而 features-time64.h / bits/wordsize.h 都是 glibc 专有，Android 的 bionic 里根本没有
        # （NDK sysroot 实测：usr/include/bits 有 42 个文件，但没有 wordsize.h）——
        # 所以这条**不是"缺头文件"，是"指错了 target"**。
        #
        # bindgen 唯一的口子就是 BINDGEN_EXTRA_CLANG_ARGS_<TARGET>（README：按 target 区分、
        # 优先级高于不带后缀的那个）。这里从这个口子把 target 与 sysroot 递进去。
        # 两个拼写都写（bindgen 两种都认）；**不设通用那个**，免得影响宿主侧 build script。
        #
        # 本机已用 NDK clang 按同一组参数试编过 <time.h>/<stdint.h>/<sys/types.h> 等，exit=0，
        # 证明这套参数自足、不依赖宿主 glibc。
        run: |
          set -e
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -d "$SYSROOT/usr/include" || { echo "找不到 NDK sysroot: $SYSROOT"; exit 1; }
          ARGS="--target=aarch64-linux-android24 --sysroot=$SYSROOT -isystem $SYSROOT/usr/include -isystem $SYSROOT/usr/include/aarch64-linux-android"
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=$ARGS"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=$ARGS"
          } >> "$GITHUB_ENV"
          echo "BINDGEN args = $ARGS"

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend + 跑门禁
        # 顺带把仓库现有的门禁在 Linux 上也跑一遍（check:ocr-assets 之类）。
        run: pnpm build

      - name: Init Android project
        # ⚠️ `src-tauri/gen` 在 .gitignore 里（"可重建"），所以 CI 必须自己 init。
        # 也因此：**任何对 gen/android 的手工改动都不可复现**——需要的定制要么脚本化，要么
        # 改成 tauri.conf.json / 平台配置文件里的声明。见上线计划的风险清单。
        run: pnpm tauri android init --ci

      - name: Build APK (arm64, unsigned)
        run: pnpm tauri android build --target aarch64 --apk --ci

      - name: 报告产物体积（**这正是这个 workflow 存在的理由**）
        run: |
          set -e
          echo "===== 产出的安装包 ====="
          find src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%10s  %p\n' | sort -n
          APK=$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -1)
          test -n "$APK" || { echo "没有产出 APK"; exit 1; }
          echo
          echo "===== APK 内部构成（未压缩体积）====="
          echo "APK: $APK  大小: $(du -h "$APK" | cut -f1)"
          python3 - "$APK" <<'PY'
          import sys, zipfile, collections
          z = zipfile.ZipFile(sys.argv[1])
          groups = collections.Counter()
          files = collections.Counter()
          for i in z.infolist():
              top = i.filename.split('/')[0] + ('/' if '/' in i.filename else '')
              groups[top] += i.file_size
              files[top] += 1
          total = sum(groups.values())
          for k, v in groups.most_common(12):
              print(f"  {v/1048576:10.1f} MiB  {files[k]:5d} 个  {k}")
          print(f"  {total/1048576:10.1f} MiB  合计（未压缩）")
          # 语言包应当不在包里（2026-09-13 起改为按需下载）；这条顺手在 CI 上把守住。
          bad = [i.filename for i in z.infolist() if 'traineddata' in i.filename]
          print("  OCR 语言包是否随包分发:", "是（不该）" if bad else "否 ✅")
          if bad: sys.exit(1)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-aarch64-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
