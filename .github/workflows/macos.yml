name: macOS (build)

# 为什么单开这个 workflow：
#
# 1. macOS 从这一版起成为**发布平台**（Developer ID 签名 + 公证），但那两条链的密钥只在
#    `release.yml` 里。于是"没有密钥的地方"（每次 push、本机）就只剩一个能问的问题：
#    **打包这一步过没过、产物对不对**。这个问题值得单独守。
#
# 2. 为什么不能靠"本机跑过就行"：这一仓库已经吃过两次「本机绿 ≠ 干净环境绿」的教训——
#    Android 的 `ranlib` 与 `mupdf-sys` 的 bindgen target **都只在 Linux runner 上暴露**，
#    而当时的注释还写着"Linux 上这些问题都不存在"。macOS 同理：本机的 Xcode / target 目录是热的，
#    runner 上是从零开始。判据只能是"推上去有没有一条绿的记录、产物在不在"。
#
# 3. 这个 workflow **刻意不碰任何密钥、不出签名包、不挂 tag**：它出的 `.app` 是未签名的
#    （`createUpdaterArtifacts` 显式关掉，否则会因为没有 `TAURI_SIGNING_PRIVATE_KEY` 而失败），
#    只能用来验"能不能打出来、打出来的东西对不对"。真正的签名 + 公证在 `release.yml`。
#
# 4. 触发方式与 `android.yml` 同款：push 到 main/dev 且命中构建输入路径，或手动触发。
#    路径过滤是必须的——否则每次改文档都会白跑十几分钟 Rust 构建。

on:
  workflow_dispatch:
  push:
    branches: ["dev", "main"]
    paths:
      - ".github/workflows/macos.yml"
      # Rust 侧（整包编进二进制）
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/src/**"
      - "src-tauri/capabilities/**"
      - "src-tauri/icons/**"
      # 打包配置：bundle 目标、identifier、深链 scheme 都在这里，改了必须重新出包
      - "src-tauri/tauri.conf.json"
      # 前端侧：`pnpm build` 的产物整包进二进制，而 build 里串着仓库门禁
      # （check-versions / check-web-commands / check-deep-link / check-capabilities…），
      # 所以门禁脚本本身也是构建输入
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build-macos:
    # macos-latest 现在是 Apple Silicon（arm64），与用户手上的 Mac 一致：
    # 产物名会是 ShuyoNote_<版本>_aarch64.dmg（见 scripts/lib/releaseArtifacts.mjs 的平台键映射）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        # 首次跑没有收益，但后续每次都能省十几分钟（这个仓库的依赖树很重：mupdf / tesseract / boa）。
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: 取 PDFium 运行时（macOS）
        # 二进制**不入库**（`.gitignore` 里有 `src-tauri/vendor/pdfium/`），而
        # `src-tauri/tauri.macos.conf.json` 把 `vendor/pdfium/mac-univ/lib/libpdfium.dylib`
        # 映射成包里的 `Contents/Frameworks/libpdfium.dylib`（Rust 侧 `pdfium_native::library_dir()`
        # 的搜索顺序里有它就够）。所以**必须先取库再打包**；`--check` 先看一眼，缺了才下载。
        # 同一个坑 Windows 侧已经吃过一次：装包里没有 pdfium.dll ⇒ 真机上只有
        # `SHUYONOTE_PDF_ENGINE=pdfium` 时才报「找不到 PDFium 动态库」，而那时代码已经发出去了。
        run: |
          node scripts/fetch-pdfium.mjs --check --platform mac-univ || node scripts/fetch-pdfium.mjs --platform mac-univ

      - name: 打包未签名的 .app + .dmg
        # `tauri build` 会先跑 `beforeBuildCommand`（= `pnpm build`，里面串着仓库门禁），
        # 再编 Rust、再打包——所以这一步同时也是一道构建门禁。
        #
        # 这里没有 `TAURI_SIGNING_PRIVATE_KEY`，所以显式关掉 `createUpdaterArtifacts`
        # （那一步属于 release.yml 的签名链；不关会因为"签不了 .app.tar.gz"而失败）。
        #
        # 为什么把覆盖配置**写成文件**而不是内联 JSON 字符串：这个仓库的门禁
        # `check-workflow-yaml.mjs` 就是被"YAML 里裸标量写崩"坑出来的（ci.yml 曾整份编译不过、
        # 49 次 push 全红且不给行号）。`--config` 本来就接受 **JSON 文件路径**
        # （`tauri build --help` 原文："JSON strings or paths to JSON, JSON5 or TOML files"），
        # 走文件既避开引号雷区，也让这一步在本地可以逐字复现。
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/tauri-ci-config.json"
          pnpm tauri build --bundles app,dmg --config "$RUNNER_TEMP/tauri-ci-config.json"

      - name: 产物自检（identifier / 版本号 / 深链 scheme / dmg 都在）
        # 这几条错了打包不会报错，但用户端会以"身份变了 / 版本号不对 / 点链接没反应"的形式暴露，
        # 而且都在很晚才发现。判据见脚本头部注释。
        run: pnpm check:macos-bundle

      - name: 报告产物体积
        run: |
          echo "=== bundle/macos ==="
          ls -la src-tauri/target/release/bundle/macos/ || true
          echo "=== bundle/dmg ==="
          ls -la src-tauri/target/release/bundle/dmg/ || true
          echo "=== .app 展开后的大小 ==="
          du -sh src-tauri/target/release/bundle/macos/ShuyoNote.app || true
