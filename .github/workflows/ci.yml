name: CI

# 2026-09-28 起：**门禁「自报跳过」必须带登记理由**才留在绿里。
# 开关＝ `TEST_REPORT_STRICT_SKIPS=1`（≡ `--strict-self-skip`，见 `scripts/test-report.mjs:57`）：
#   凡门禁**自报跳过**、而 `scripts/lib/gates.mjs` 里没写 `selfSkipOk` 理由的，**按失败计**。
#   ⇒ 从今天起，**「跳过」与「通过」在 CI 里是可区分的**（此前那一格只写 passed，读不出"验过没"）。
# 为什么现在敢打开：① 本机 `TEST_REPORT_STRICT_SKIPS=1` 与默认读数**逐字相同**（exit 0，自报跳过 0 条）；
#   ② CI 侧现存的 2 条自跳（`check-sys-deps`／`gm-conformance`）**都已在 `gates.mjs` 登记理由**
#      （2026-09-28 复核：`gates.mjs` 共 4 处 `selfSkipOk`；run #622 的工件里两者 `registered=true`）。
# 跨机口径：macOS 侧 2026-09-28 拍定 **A′**（见其 `…strict-self-skip-decision-windows.reply-3.md`，附"开了会不会红"的读数）。
# 若将来某条门禁**无理由**自跳 ⇒ 它会在这里红 —— 那是要的：**要留在绿里就得写理由**。
env:
  TEST_REPORT_STRICT_SKIPS: "1"

# 单测 / 冒烟 / 布局验收 / 契约检查。
#
# 为什么必须有这个 workflow：这些检查此前**只靠人记得跑**。两套既有 CI 都不跑测试
# ——pages.yml 只 install + build:web，release.yml 只构建安装包，所以
# `scripts/smoke-web.mjs`（350 断言，被文档定为「web 平台行为的事实标准」）
# 曾因一处无守卫的 localStorage 访问**整套崩掉**而长期无人察觉：没有自动化在跑它，
# 谁都没看见它是红的。同理，27 断言的近实时集成回归、40 断言的移动端布局验收，
# 也都只能靠人肉保证。
#
# 需要服务端的集成脚本（sync-regression / sync-collab-regression）**不在这里**：
# 它们要一个跑着的同步服务端，放在服务端仓库的 CI 里——那边能直接构建二进制。
# 这份边界登记在 `tests/external-suites.json`，并会出现在每次的汇总摘要里——
# "没跑"和"跑了且通过"必须能被区分，否则读者会把空白当成绿。
#
# 结果公开（2026-09-16 起）：门禁清单搬进 `scripts/lib/gates.mjs`（本地 `pnpm verify`
# 与 CI 共用同一份，不再靠人照 YAML 手抄），每轮跑完由 `scripts/test-report.mjs`
# 写 **$GITHUB_STEP_SUMMARY**（人可读表格）并落 JSON 报告作为 artifact（机器可读、可追溯）。
# 断言数下限由 `tests/baseline.json` 校验：调低它等于删断言，会让 CI 红。
# 门禁总表与"每条挡什么事故"见 `docs/TESTING.md`。

on:
  push:
    # 这里只有 main / dev。曾经还有 `feat/android-mobile`（Android 的高风险改动——签名 / 打包 /
    # 权限清单——都落在那条分支上）；该分支已于 2026-09-14 整体并入 main 后删除，触发列表随之收窄。
    # 留下这段注释是因为教训仍然成立：**改动最危险的分支不能没有 CI**。后果是实测过的——ci.yml
    # 曾整个文件编译不过（run 值以 `:` 结尾），在那个当时没有任何 CI 覆盖的分支上 49 次 push 全红
    # 却没人察觉，因为"红"在那条分支上已经成了常态。代价是每次 push 多跑一轮完整 CI（约 5 分钟）。
    branches: [main, dev]
  pull_request:
    # pull_request 的 branches 过滤的是**基线分支**：特性分支的 PR 目标是 main/dev，已被上面两行
    # 覆盖。那条长期特性分支 `feat/android-mobile` 同理不必列为基线——把它列为基线只对"往那条
    # 临时分支开的 PR"生效，没有价值（该分支已于 2026-09-14 合并后删除）。
    branches: [main, dev]
  schedule:
    # 定时回归：push/PR 只能挡住"本次改动引入的红"，挡不住**依赖漂移**——上游 npm 包、
    # rust 工具链、Chromium 版本自己变了，仓库一行没改也会坏。每天 UTC 18:00（北京 02:00）
    # 跑一轮，绿的记录落在 run 历史与 artifact 里；红的时候 GitHub 会按默认通知规则提醒。
    # 刻意**不**引入第三方 action 去自动开 issue：多一个供应链依赖，与"结果可核验"无关。
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 单测 / 冒烟 / 契约
    runs-on: ubuntu-latest
    steps:
      # ⚠️ `fetch-depth: 0` **不是**可选的：契约组里 `check-changelog-version-parity` 要看提交历史
      #    （"这一笔有没有同时改版本文件"）。checkout 默认只取 1 个提交，而浅克隆下**有两种形态**，
      #    **后一种更危险**：
      #     ① `origin/main` 不在 ⇒ 走 `HEAD^..HEAD` 兜底 ⇒ 崩成"判不了"（exit 3，**红**）；
      #     ② `origin/main` **在**且 `== HEAD`（CI 上常见）⇒ 范围为空 ⇒ 修前打印"✓ 这 0 笔……"**退出 0**
      #        —— **假绿**："什么都没看见"被当成"通过"。
      #    （② 是 Windows 侧实测出来的、macOS 独立复现并确认；修法：浅克隆 + 空范围 ⇒ **判不了**）
      #    ⇒ 这条 `fetch-depth` 同时治 ①②；将来谁为了省 CI 时间想删它，请看上面两行再决定。
      #    若不想取全历史，可改成给该步设 `SHUYONOTE_CHANGELOG_PARITY_RANGE=<base>..<head>`。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 回归门禁（contract + smoke + sync + plugin）
        # 门禁清单在 `scripts/lib/gates.mjs`——本地 `pnpm verify` 与这一步**同源**，
        # 不再靠人照着 YAML 手抄（抄漏一条没人会发现）。每条门禁"挡什么事故"写在注册表里，
        # 总表与覆盖边界见 `docs/TESTING.md`。
        #
        # ⚠️ 自指边界（原样保留，这条很重要）：它只能挡住**别的** workflow 文件被改坏。
        # 如果坏掉的正是 `ci.yml` 自己，这个文件根本编译不过 ⇒ workflow 不会被调度 ⇒
        # 这一步也不会被执行 ⇒ **任何写在仓库里的自检都救不了自指**（`pnpm build` 同理，
        # 它只在 CI 之外由人触发）。这种自指只能靠**外部观察**发现：run 名显示为**文件路径**
        # 而不是 `name: CI`、job 数为 0、且无视 branches 过滤——2026-09-12 起 49 次 push 全红
        # 就是这个症状（完整红线说明见 `rust-tests` 那一步的 `plugins::` 注释，不重复）。
        run: node scripts/test-report.mjs --group contract,smoke,sync,plugin --json test-report-checks.json

      - name: 失败时把「哪条门禁红了」变成注解（日志要鉴权时唯一的证据通道）
        # 为什么需要它（2026-09-17 的教训）：CI 在默认组连红三次，而**没人能说出是哪条门禁**——
        # 步骤日志与 artifact 都要鉴权，注解是空的，于是红只变成了"又红了"。团队为此白花了半天。
        # 这一步把失败的门禁逐条打成 `::error::`：工作流命令产生的注解得**无需鉴权**就能读到
        # （`/repos/{owner}/{repo}/check-runs/{id}/annotations`），失败证据从此有地方落。
        #
        # ⚠️ 只报告、不改变结论：`if: failure()` 且末尾 `exit 0`，红还是原来的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-checks.json

      - name: 回归门禁（browser：真实 Chromium + 构建产物）
        # 冒烟跑的是 dev server，跑不到"**构建产物**能不能打开"这件事。而 Web 版是每次推
        # main 自动部署的（Pages），构建成功 ≠ 打开能用：v1.84.1 踩过一次，按静态引用过滤
        # 删旧文件，把 sql.js 的 wasm / pdf worker 这类运行时才加载的资源删了——页面照开、
        # DB 初始化失败、所有查询报错。这条在 CI 里先兜住。
        run: node scripts/test-report.mjs --group browser --json test-report-browser.json

      - name: 失败时把「哪条门禁红了」变成注解（browser 组）
        # 与上面默认组那条同一个理由；这一条的**紧迫性还是它自己证明的**：
        # 2026-09-17 修好默认组之后，browser 组立刻从"被跳过"变成"真红"——
        # 也就是说它在之前每一次红里都是**被前一步掩盖**的，谁都没看到。诊断通道必须覆盖每一步，
        # 否则"哪一步先红"决定了我们能不能看见后面的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-browser.json

      - name: 上传回归报告（机器可读）
        # `if: always()`：报告在**失败那一轮**最有价值——否则"红了但没有证据"。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-checks
          path: |
            test-report-checks.json
            test-report-browser.json
          retention-days: 30

  mobile-layout:
    name: 移动端布局验收（真实 Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # 这一档刻意用真实浏览器：侧栏/竖条的行为藏在「CSS 层叠 + matchMedia +
      # z-index + localStorage」的交叉处，happy-dom 不按视口重算媒体查询，
      # 单测覆盖不到（`.sidebar{display:flex}` 压掉 `[hidden]` 就是这类）。
      - name: 启动 web 开发服务
        run: |
          nohup pnpm dev:web > /tmp/webdev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5173/; then
              echo "dev server 就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server 未在 120s 内就绪"
          cat /tmp/webdev.log
          exit 1

      # 浮层/弹窗验收接着上一条跑，同一个 dev server。
      # 挡的是三类"功能直接不可用、而且都不报错"的坏法：
      #   · `.set-dialog{min-width:640px}` 压过 `max-width` ⇒ 设置面板**关不上**；
      #   · 窄屏收起的竖条带 `transform`、成了 `position:fixed` 浮层的包含块 ⇒
      #     算好的 `left:8` 落在 -40px；
      #   · 没有滚动锁 ⇒ 浮层打开时手指拖背景把正文拖走（锁 body 无效，
      #     真正滚的是 `.note-scroll`）。
      # 视口两档（360x640 / 390x844）+ 一档桌面：后者防"窄屏规则把桌面也改成弹层"。
      - name: 移动端布局 + 浮层验收（真实 Chromium）
        run: node scripts/test-report.mjs --group mobile --json test-report-mobile.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-mobile
          path: test-report-mobile.json
          retention-days: 30

      - name: 失败时输出 dev server 日志
        if: failure()
        run: cat /tmp/webdev.log || true

  # 为什么要有这个 job：`src-tauri` 里有真正的 Rust 单测（如 plugins.rs 的 manifest
  # 校验 / 插件 id 白名单 / manifest.main 同级文件名约束），但此前**没有任何 CI 跑过
  # 它们**——上面那个 job 是纯 JS 侧检查，release.yml 只出安装包，GitCode 流水线只构建
  # .deb/.AppImage，Rust 侧回归只能靠人记得敲 `cargo test`。这里把它顶上。
  #
  # 依赖列表与 rust 工具链**照抄** release.yml 的 Linux 档：这个 crate 在 Linux 上要链
  # webkit2gtk + bundled-sqlcipher 用的 OpenSSL，少一个包都编译不过。
  # `cargo test` 编译的是 dev 档（走 tauri.conf.json 的 devUrl 分支），
  # tauri-codegen 不会去校验 `../dist`，所以这里不需要先跑前端构建 / 装 node。
  #
  # M11.13 阶段 1 起这一档是 `cargo test`（不只 `--lib`）：插件宿主的**集成测试**
  # （`src-tauri/tests/plugin_host.rs`）要起一个真的子进程——它拿 `CARGO_BIN_EXE_shuyonote`
  # 拿到应用二进制并 re-exec 自己，所以必须编译 bin target。那些断言（分流在 Tauri 之前、
  # 握手先于请求、能力通道穿得过、父进程 drop 不留孤儿）**只有在 CI 里跑才有价值**——
  # 它们正是"进程边界可用"的回归。构建时间长一点是值得的（方案 §6.2：宁可测试慢一点）。
  #
  # ★ 2026-11-21（owner 拍「把 rust 这条线的墙钟压下来」）：**一个 job 拆成两个**，判据一条没动。
  #
  # 读数从哪来（可核）：run #1798（`d4c8527c`）的工件 `test-report-rust` 里 9 条门禁各自的
  # `durationMs`，逐个相加 = **2028.6 s = 33.8 min**，与 job 墙钟 **39.1 min** 对得上
  # （差额是 checkout / 工具链 / 缓存恢复 / apt / 打包）：
  #   `rust-sm-wired`      1084.6 s（18.1 min）← rust 组的 **53.5%**，一条门禁占掉一半
  #   `rust-test`           617.2 s（10.3 min）
  #   `rust-no-sm-crypto`   262.2 s（ 4.4 min）
  #   `rust-plugins-alone`   56.6 s
  #   其余 5 条合计            7.7 s（fmt 3.3 / gm-conformance 3.3 / sys-deps 0.6 / registry-clean 0.4 / crypto-backend 0.1）
  #   （逐项相加 = 2028.3 s，与上面的 2028.6 s 差 0.3 s 是各自四舍五入）
  # 另两步也量过（同一 artifact 之外的 step 计时）：`--features lan-quic` **2.45 min**、
  # `--features relay` **0.23 min**（后者复用前者的 target ⇒ **别把两次 feature check 拆成两个 job**，
  # 拆开就没有那 0.23 了）、打包自检 **0.90 min**。
  #
  # ⇒ 结论与"看起来该拆"的直觉相反：**打包（0.9 min）和两次 feature check（2.7 min）都不是瓶颈**，
  #   39.1 min 里 33.8 是这 9 条 cargo 门禁**串行相加**。所以只按"能不能共用同一份 target"拆一刀：
  #   ① 本 job：默认特性这条线（rust-test / fmt / plugins-alone / gm-conformance / no-sm-crypto / sys-deps）
  #      ＋ 两次 feature check（复用本 job 默认特性的 target，见上面 0.23 那条读数）
  #      ＋ 打包自检（`--group artifact` 里的两条要 `cargo test --lib`，也是默认特性 ⇒ 复用同一份；
  #      单独拆出去反而要白白重编一遍）。
  #   ② `rust-gm-wiring`：国密补丁那条线（`rust-sm-wired` ＋ 两条读"补丁已还原后"状态的检查）。
  #      它要往 `.gm-build/` 打补丁、`cargo clean -p` 两个 crate、用 `--features sm-library` 整编，
  #      最后再 `cargo build --lib` 把默认特性编回来 —— 与 ① **共用不了** target（feature 集不同 +
  #      补丁态），今天本来就是三次独立整编串在一个 job 里 ⇒ 拆开只是让它们**并行**。
  #
  # ⚠️ 为什么不顺手拆成 3 个 job：`rust-sm-wired` 一条就 18.1 min，第三刀（把 4.4 min 的
  #   no-sm-crypto 或 2.7 min 的 feature check 拆出去）只会让**最慢那个**还是 ~20 min，却多付一份
  #   checkout/工具链/apt/缓存恢复（实测 1.46 min）+ 一份 target 缓存。**拆法要让"最慢"变小，
  #   不能只让"平均"变小。**
  #
  # ⚠️ 拆 job 的代价（量化，别当成免费的）：target 缓存从一份变两份（shared-key 分开）。
  #   `rust-tests` 沿用旧 `shared-key` ⇒ 它拆完**首跑就命中**现有那份缓存（不重新冷编）；
  #   而 `rust-gm-wiring` **首跑**要自己冷编一遍依赖树（**估计 25~35 min，无实测**；依据：无缓存时
  #   这个组实测到过 19~52 min，而缓存命中后编译只占 ~83 s），稳定后回到 ~20 min。
  #   ⚠️ 若首跑代价不可接受，可退成"两个 job 共用 `shared-key: rust-tests`"：B 立刻拿到那份含
  #   sm-library 产物的缓存，但两者争同一个 key、且 rust-cache 命中主键时**不覆盖保存** ⇒
  #   长期有一方拿不到自己的增量。默认选"分开"，因为它可确定、可解释。
  #   但**不会**变成"整棵依赖树 ×3"：今天那份 1593 MB 缓存里本来就同时躺着三套 feature 集的产物
  #   （默认 / no-default / sm-library），拆开只是把它们分到两个 key 下，总字节上限 ~2×1593 MB。
  #   且实测缓存命中后 job 墙钟是 39.1 min（未命中 40.1）⇒ 缓存省的不是主要成本，主要成本是
  #   **测试执行本身**：run #1798 的日志里 `rust-test` 这一格 617 s = 编译 83 s + 单测跑 526 s
  #   （`test result: ok. 1559 passed; … finished in 526.09s`）⇒ 拆 job 能并行的只是"不同 feature 集的
  #   整编 + 国密那条独立链"，**并不到测试运行时**。想再往下压只有两条路：减测试耗时，或改
  #   `check-gm-wired.mjs` 的收尾（它在独立 job 里不必再把默认特性编回来）——后者要改门禁脚本，
  #   属于另一次改动。
  rust-tests:
    name: Rust 测试（cargo test ＋ feature 构建 ＋ 打包验收）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ⭐ **2026-11-20（owner 拍「加缓存」）**：这个仓**一直零缓存** ⇒ 每次 CI 都冷编译整棵依赖树
      #   （tauri / iroh / …）。实测当天 12 次 rust 组的耗时：**19 / 23 / 24 / 30 / 31 / 32 / 33 / 52 分钟**
      #   （`_tmp` 里那份 `read-ci` 读数），而测试本身只占约 9 分钟（本机全量 lib 530 s 量级）。
      #   ⇒ 加一层 Rust 构建缓存，把"每次重编依赖"这部分压掉。
      #
      # 为什么用 `Swatinem/rust-cache` 而不是手写 `actions/cache`：
      #   它按 `Cargo.lock` ＋ rustc 版本算 key、自动做"只存不覆盖/PR 用只读缓存"、并清掉无用 artifacts；
      #   手写要自己处理 key 公式与 `save-if`，写错会**静默变成永久不命中**（这比没有缓存更糟：看不出没生效）。
      #
      # ⚠️ 三条边界：
      #   1. `workspaces: src-tauri -> target` —— 这个仓的 target 在 `src-tauri/target`，
      #      不写这一行它会去缓存**根目录**的 target（那里没有）⇒ 缓存永远空转；
      #   2. 缓存只影响**速度**，不影响判定：同一份代码在命中/未命中两种情况下都必须给出同样结论
      #      （所以它不能替代任何门禁，也不许因为"缓存里是绿的"就跳过测试）；
      #   3. 缓存坏了就是**慢**，不会变红 —— 真出问题把 `shared-key` 或 `key` 换一个即可。
      #
      #   ⭐ 2026-11-21 复核（别把缓存当万能）：装上之后两次实测 **40.1 / 39.1 分钟**，缓存**命中**
      #      （run #1798 的日志逐字：`Cache hit for: v0-rust-rust-tests-Linux-x64-2fd77104-0952ff42`、
      #      `Cache Size: ~1593 MB (1670653807 B)`、`Cache restored successfully`）只省约 **1 分钟**
      #      ⇒ **"重编依赖"不是主要成本**：同一次跑的 `rust-test` 617 s 里编译只占 ~83 s，
      #      其余 526 s 是**测试执行**（见本 job 开头那段）。
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-tests

      - name: 确保 rustfmt（rust 组的 fmt 门禁用它）
        # `dtolnay/rust-toolchain@stable` 的默认 profile 带 rustfmt；这一行是**显式钉住**：
        # 将来换 toolchain / 有人把 profile 改成 minimal 时，红在这一步（一眼看懂），
        # 而不是让 `check-rustfmt` 在 rust 组里报「环境不具备」。
        run: rustup component add rustfmt

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: 取 PDFium 运行时（Linux）
        # P3 对拍判据需要它（`vendor/pdfium/` 不入 git）。**先取库再跑 rust 组**，
        # 这样这一项在 CI 上是**真跑**而不是跳过；取不到就红在这一步（诚实：CI 拿不到钉死版本就该报）。
        run: node scripts/fetch-pdfium.mjs --check --platform linux-x64 || node scripts/fetch-pdfium.mjs --platform linux-x64

      - name: Rust 测试（cargo test，含宿主子进程集成测试）
        # 门禁清单在 `scripts/lib/gates.mjs` 的 rust 组：全量 `cargo test` + 插件模块**单独再跑一遍**
        # （2026-09-13 那类缺陷：某测试依赖进程级 APP_DATA_DIR ⇒ 单跑必红、全量反而绿，
        # 改一行只跑一条时极易误判；修法是测试自给自足，这条门禁防它回来）。
        #
        # ★ 2026-11-21：命令从 `--group rust` 改成 `--group rust --only <本 job 那 6 条>`，
        #   因为 `rust-sm-wired` 挪去 `rust-gm-wiring` 并行跑了（读数与拆法见上面这个 job 的开头）。
        #   ⚠️ `--group rust` **仍要给**：`test-report.mjs` 用它算"本轮未覆盖的组"，只给 `--only`
        #   会在 CI 摘要里写成「rust 组未覆盖」——那是假话（`--only` 只决定*跑哪几条*）。
        #   ⛔ 这条 `--only` 名单必须与 `rust-gm-wiring` 那条**合起来 = gates.mjs 的整个 rust 组**。
        #   门禁清单的唯一出处仍是 `scripts/lib/gates.mjs`；这里只是"哪条在哪个 job 跑"的映射，
        #   将来**加一条 rust 门禁时两个 job 都要看一眼**（否则它会静默没有 job 跑它）。
        #   ⚠️ 读 CI 摘要时注意：本 job 的摘要是 rust 组的**部分读数**（6 条），另外 3 条在
        #   `rust-gm-wiring` 的摘要里 —— 别把这里的 "rust 6/6" 读成"rust 组只有 6 条"。
        #
        # ⚠️ 一条必须留在这里的教训：那条命令含行尾冒号（`--lib plugins::`）——YAML 的 plain scalar
        # 不允许以 `:` 结尾。若有人把它抄回本文件的 `run:` 且不加引号，整个 workflow 文件编译不过；
        # GitHub 对这种错误**不给行号、不给日志**，只产出一条 0 个 job 的红色 run（run 名是文件路径
        # 而不是 `name: CI`）——2026-09-12 起 49 次 push 全红、连纯文档提交也红，就是这一行。
        # 现在它跑在 .mjs 里，绕开了 YAML 标量规则；`check-workflow-yaml` 另有窄规则兜底。
        run: >-
          node scripts/test-report.mjs --group rust
          --only rust-test,check-rustfmt,rust-plugins-alone,gm-conformance,rust-no-sm-crypto,check-sys-deps-linux
          --json test-report-rust.json

      # ★ 2026-11-08（复核 #4 最小步）：**feature 构建也要进 CI**。
      #
      # 为什么加：`--features lan-quic` / `--features relay` 下的 cfg 代码（`lan_quic.rs`、
      # `relay_tunnel::iroh_tunnel` 的 relay 子集、以及这些 feature 专属的判据）此前**没有任何
      # CI 编译过** —— 它们只在有人本机手动加 feature 时才被看见；cfg 写坏时默认 `cargo test`
      # 永远是绿的。这里只做 **`cargo check --lib`**（编译检查，不跑测试）：先把"编得过"钉进 CI。
      # ⛔ **不替换/不削弱**现有的默认 `cargo test`：默认档仍是唯一跑测试的那一步。
      #
      # 为什么两条都要：`relay` 叠在 `lan-quic` 上（feature 分层，见 `Cargo.toml` 与 ADR §3.2），
      # 但两者启用的代码面不同（`lan-quic` 只开 iroh 本体；`relay` 才编 `bind_with_relay*` 等）
      # ⇒ 只 check `relay` 会漏掉"`lan-quic` 单独构建编不过"这一档，所以分开两步、分开报红。
      #
      # 超时/并发：本 job 本来就装齐了 Linux 系统依赖 ＋ rust 工具链；这两步复用同一个 target
      # 目录的增量编译 ⇒ 不新增 job、不改 `concurrency`/超时设置（只多两次 check 的编译时间）。
      - name: Rust feature 构建检查（--features lan-quic，--lib）
        run: cargo check --manifest-path src-tauri/Cargo.toml --features lan-quic --lib

      - name: Rust feature 构建检查（--features relay，--lib）
        run: cargo check --manifest-path src-tauri/Cargo.toml --features relay --lib

      - name: 失败时把「哪条门禁红了」变成注解（rust 组）
        # 与默认组/浏览器组那两步**同一个理由**，而这一步的必要性是它自己证明的（2026-09-19）：
        # rust 组改成红之后，注解是空的、日志要 admin ⇒ 只能看到"exit code 1"，
        # **说不出是哪条门禁**（当时实际是新增的门禁在 Linux 上自动打开了"跨实现"分支）。
        # 诊断通道必须覆盖每一步，否则"哪一步先红"决定了我们能不能看见后面的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-rust.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-rust
          path: test-report-rust.json
          retention-days: 30

      # ★ 2026-10-31：**随安装包分发的 Rust 桥**（独立 crate，不在 `src-tauri` 包里）也要有 CI。
      #
      # 为什么必须单列一步：上面 `--group rust` 跑的 `cargo test` 只是 `src-tauri/Cargo.toml` 那个包
      # （门禁清单在 `scripts/lib/gates.mjs` 的 rust 组）⇒ 独立 crate 的 8 条桥单测在 CI 上**一条都没跑过**，
      # 桥回归只有本机知道。这与 `rust-tests` 这个 job 当初的来由同形（Rust 侧回归只能靠人记得敲
      # `cargo test`）⇒ 同样用"机器跑"收口。
      #
      # 为什么**只**加这一条、且不并进 rust 组：该 crate 只依赖 `serde_json` —— 无系统依赖、不碰 Tauri /
      # OpenSSL，也不需要 node / 前端构建 ⇒ 不需要额外的 apt 包或缓存 action，一条 `cargo test` 就够
      # （`dtolnay/rust-toolchain@stable` 那步已经装好工具链）。`--locked` 钉住
      # `tools/shuyonote-mcp-rust/Cargo.lock`（锁过期就当场红，而不是悄悄重新解析依赖）。
      # 工作目录＝仓根（本 job 全程没有 `working-directory`），所以 `--manifest-path` 直接给相对路径。
      #
      # ⚠️ 边界（别把这一步读成"桥也被 rust 组门禁覆盖了"）：它**不在** `scripts/lib/gates.mjs` 里 ⇒
      # 本机 `pnpm verify:rust` 不会跑它；要本机也跑就得把一条 rust-bridge 门禁注册进注册表（另一次改动）。
      # ⚠️ 本步**只在 GitHub 上跑**（GitCode 侧不跑 rust 组，见 `docs/TESTING.md` 的「覆盖边界」）。
      - name: Rust 桥单测（随包 crate：tools/shuyonote-mcp-rust）
        run: cargo test --manifest-path tools/shuyonote-mcp-rust/Cargo.toml --locked

      # 外部产物的验收：**我们打出来的包、我们签出来的索引，应用真正的解析器与校验器认不认**。
      # 两段分别在别处有测试（打包工具在 JS 侧、解析/校验在 Rust 侧），但"接起来"那段
      # 只有靠人记得敲命令——而它恰恰是最容易在改动里悄悄坏掉的一段
      # （实测过：打包从命令行 zip 换成库，字节布局变了；签名验过但解不开，只有装的时候才炸）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖（供打包工具用它自己那份 fflate）
        run: pnpm install --no-frozen-lockfile

      - name: 打一个真包（一次性密钥，只用于流水线自检）
        run: |
          node scripts/plugin-fragment.mjs \
            --plugins examples/plugins/md-outline \
            --out "$RUNNER_TEMP/frag" \
            --ephemeral-key

      - name: 应用版本进环境（片段里的 minAppVersion 就是它）
        # 取**当前**那个：填个小版本会让"可安装"这条断言变成"需要应用 X+"——
        # 我第一次就填了 1.0.0，本地演练当场抓出来。
        run: echo "SHUYONOTE_INDEX_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 外部产物验收（应用真解析器 / 真校验器）+ 打包不依赖系统 zip
        # 走注册表的 artifact 组：`--strict` 让"缺环境变量"按**失败**计——没跑不许冒充通过。
        # 其中 `plugin-fragment-no-zip` 挡的是回来路：打包**不许**再依赖命令行的 `zip`
        # （Windows 上没有它，那边 `pnpm test` 红过三条）。
        env:
          SHUYONOTE_INDEX_FIXTURE: ${{ runner.temp }}/frag/plugin-index.preview.json
          SHUYONOTE_PKG_ZIP: ${{ runner.temp }}/frag/md-outline-1.0.0.zip
          SHUYONOTE_PKG_SIG: ${{ runner.temp }}/frag/md-outline-1.0.0.zip.minisig
          SHUYONOTE_PKG_PUB: ${{ runner.temp }}/frag/publisher.pub
        run: node scripts/test-report.mjs --group artifact --strict --json test-report-artifact.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-artifact
          path: test-report-artifact.json
          retention-days: 30

      # 打包不许依赖命令行 `zip` 的那条门禁已搬进注册表（artifact 组的 `plugin-fragment-no-zip`，
      # 见 scripts/lib/gates.mjs）——它在 Windows 上跑得动，不像这里的 grep 只认 Linux。

  # ============================================================================
  # ★ 2026-11-21：国密接线构建**单独一个 job**（原先排在 `rust-tests` 里，是那三条门禁之一）。
  #
  # 为什么拆：`rust-sm-wired` 在 run #1798（`d4c8527c`）里 **1084.6 s = 18.1 min**，
  #   占整个 rust 组（33.8 min）的 **53.5%**、占 job 墙钟（39.1 min）的 46% —— 一条门禁就是瓶颈。
  #   而它**没法**和默认特性那几套共用 target：① 往 `.gm-build/` 打国密补丁；② `cargo clean -p`
  #   `libsqlite3-sys` / `shuyonote`；③ 用 `--features sm-library` 把整棵目标重编一遍并跑全量单测；
  #   ④ 还原补丁，再把**默认特性**编回来（为了同一 job 里后面的 `check-crypto-backend` 不读到混态）。
  #   ①–④ 全在一条门禁内部串行 ⇒ 拆成独立 job 后它与 `rust-tests` **同时**跑，
  #   墙钟从"相加"变"取最大"。
  #
  # 为什么 `gm-registry-clean` / `check-crypto-backend` 也在这：这两条读的是**跑过 cargo 之后**的
  #   registry 与构建产物，而今天它们排在 `rust-sm-wired` **后面**，看到的正是"补丁已还原、默认特性
  #   已编回"那个状态 ⇒ 搬过来才与今天**同形**（`gm-registry-clean` 的一半价值就是"还原干净没"）。
  #   搬到 `rust-tests` 会让它们读一个**从没打过补丁**的 registry —— 照样绿，但那个观察点没了。
  #
  # ⚠️ 系统依赖配方与 `rust-tests` 的 `Linux system deps` **逐字相同**（少一个包就编不过）。
  #   注意 `scripts/check-sys-deps.mjs` 的 `readCiRecipe()` 只取文件里**第一处**
  #   `name: Linux system deps` ⇒ 第一处（`rust-tests` 里那份）仍是硬判据的唯一来源；
  #   两处必须同步改，否则判据会悄悄只校一份。
  #
  # ⚠️ PDFium 也必须取：`rust-sm-wired` 跑的是**全量** `cargo test`，其中
  #   `pdfium_matches_mupdf_on_fixtures` 在库不在时会**响亮自报跳过**（不判红）⇒ 忘了取不会红，
  #   但那一条就静默地没做比对。这正是本仓最反对的"跳过冒充通过"，所以照抄 `rust-tests` 那一步。
  #
  # ⚠️ 缓存：`shared-key` 与 `rust-tests` **分开**（`rust-gm-wiring`），理由见 `rust-tests` 开头那段
  #   代价量化 —— 首次跑是冷的（估计 25~35 min，无实测），之后回到 ~20 min。
  # ============================================================================
  rust-gm-wiring:
    name: Rust 国密接线构建（sm-library 全量单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存（国密接线专用 key）
        # `workspaces: src-tauri -> target` 与主 job 同理：target 在 `src-tauri/target`，
        # 不写这一行会去缓存根目录的 target（那里没有）⇒ 缓存永远空转。
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-gm-wiring

      - name: Linux system deps
        # ⚠️ 与 `rust-tests` 那份**逐字相同**（上面注释解释了为什么必须同步）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: 取 PDFium 运行时（Linux）
        # 见上面那条 ⚠️：全量 `cargo test` 里的 PDFium 对拍靠它才真跑（取不到就红在这一步）。
        run: node scripts/fetch-pdfium.mjs --check --platform linux-x64 || node scripts/fetch-pdfium.mjs --platform linux-x64

      - name: Rust 国密接线构建（rust-sm-wired ＋ 两条产物/registry 检查）
        # 这 3 条合起来就是 `rust-tests` 那条 `--only` 名单的**补集**（9 条 rust 门禁全在 CI 里跑）。
        # 顺序按注册表：`rust-sm-wired` → `gm-registry-clean` → `check-crypto-backend`，
        # 与今天在单 job 里的相对顺序**完全一致**（后两条必须排在打补丁/还原之后）。
        # ⚠️ 本 job 的 CI 摘要只会写 "rust 3/3"（rust 组的另外 6 条在 `rust-tests` 的摘要里）。
        run: >-
          node scripts/test-report.mjs --group rust
          --only rust-sm-wired,gm-registry-clean,check-crypto-backend
          --json test-report-rust-gm.json

      - name: 失败时把「哪条门禁红了」变成注解（国密接线 job）
        # 与其它 job 那几条同一个理由：日志要鉴权时，注解是唯一无需鉴权的失败证据通道。
        # 只报告、不改变结论（`if: failure()` + `exit 0`）。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-rust-gm.json

      - name: 上传回归报告（机器可读，国密接线）
        # `if: always()`：报告在**失败那一轮**最有价值。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-rust-gm
          path: test-report-rust-gm.json
          retention-days: 30
