name: CI

# 单测 / 冒烟 / 布局验收 / 契约检查。
#
# 为什么必须有这个 workflow：这些检查此前**只靠人记得跑**。两套既有 CI 都不跑测试
# ——pages.yml 只 install + build:web，release.yml 只构建安装包，所以
# `scripts/smoke-web.mjs`（350 断言，被文档定为「web 平台行为的事实标准」）
# 曾因一处无守卫的 localStorage 访问**整套崩掉**而长期无人察觉：没有自动化在跑它，
# 谁都没看见它是红的。同理，27 断言的近实时集成回归、40 断言的移动端布局验收，
# 也都只能靠人肉保证。
#
# 需要服务端的集成脚本（sync-regression / sync-collab-regression）**不在这里**：
# 它们要一个跑着的同步服务端，放在服务端仓库的 CI 里——那边能直接构建二进制。
# 这份边界登记在 `tests/external-suites.json`，并会出现在每次的汇总摘要里——
# "没跑"和"跑了且通过"必须能被区分，否则读者会把空白当成绿。
#
# 结果公开（2026-09-16 起）：门禁清单搬进 `scripts/lib/gates.mjs`（本地 `pnpm verify`
# 与 CI 共用同一份，不再靠人照 YAML 手抄），每轮跑完由 `scripts/test-report.mjs`
# 写 **$GITHUB_STEP_SUMMARY**（人可读表格）并落 JSON 报告作为 artifact（机器可读、可追溯）。
# 断言数下限由 `tests/baseline.json` 校验：调低它等于删断言，会让 CI 红。
# 门禁总表与"每条挡什么事故"见 `docs/TESTING.md`。

on:
  push:
    # 这里只有 main / dev。曾经还有 `feat/android-mobile`（Android 的高风险改动——签名 / 打包 /
    # 权限清单——都落在那条分支上）；该分支已于 2026-09-14 整体并入 main 后删除，触发列表随之收窄。
    # 留下这段注释是因为教训仍然成立：**改动最危险的分支不能没有 CI**。后果是实测过的——ci.yml
    # 曾整个文件编译不过（run 值以 `:` 结尾），在那个当时没有任何 CI 覆盖的分支上 49 次 push 全红
    # 却没人察觉，因为"红"在那条分支上已经成了常态。代价是每次 push 多跑一轮完整 CI（约 5 分钟）。
    branches: [main, dev]
  pull_request:
    # pull_request 的 branches 过滤的是**基线分支**：特性分支的 PR 目标是 main/dev，已被上面两行
    # 覆盖。那条长期特性分支 `feat/android-mobile` 同理不必列为基线——把它列为基线只对"往那条
    # 临时分支开的 PR"生效，没有价值（该分支已于 2026-09-14 合并后删除）。
    branches: [main, dev]
  schedule:
    # 定时回归：push/PR 只能挡住"本次改动引入的红"，挡不住**依赖漂移**——上游 npm 包、
    # rust 工具链、Chromium 版本自己变了，仓库一行没改也会坏。每天 UTC 18:00（北京 02:00）
    # 跑一轮，绿的记录落在 run 历史与 artifact 里；红的时候 GitHub 会按默认通知规则提醒。
    # 刻意**不**引入第三方 action 去自动开 issue：多一个供应链依赖，与"结果可核验"无关。
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 单测 / 冒烟 / 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 回归门禁（contract + smoke + sync + plugin）
        # 门禁清单在 `scripts/lib/gates.mjs`——本地 `pnpm verify` 与这一步**同源**，
        # 不再靠人照着 YAML 手抄（抄漏一条没人会发现）。每条门禁"挡什么事故"写在注册表里，
        # 总表与覆盖边界见 `docs/TESTING.md`。
        #
        # ⚠️ 自指边界（原样保留，这条很重要）：它只能挡住**别的** workflow 文件被改坏。
        # 如果坏掉的正是 `ci.yml` 自己，这个文件根本编译不过 ⇒ workflow 不会被调度 ⇒
        # 这一步也不会被执行 ⇒ **任何写在仓库里的自检都救不了自指**（`pnpm build` 同理，
        # 它只在 CI 之外由人触发）。这种自指只能靠**外部观察**发现：run 名显示为**文件路径**
        # 而不是 `name: CI`、job 数为 0、且无视 branches 过滤——2026-09-12 起 49 次 push 全红
        # 就是这个症状（完整红线说明见 `rust-tests` 那一步的 `plugins::` 注释，不重复）。
        run: node scripts/test-report.mjs --group contract,smoke,sync,plugin --json test-report-checks.json

      - name: 失败时把「哪条门禁红了」变成注解（日志要鉴权时唯一的证据通道）
        # 为什么需要它（2026-09-17 的教训）：CI 在默认组连红三次，而**没人能说出是哪条门禁**——
        # 步骤日志与 artifact 都要鉴权，注解是空的，于是红只变成了"又红了"。团队为此白花了半天。
        # 这一步把失败的门禁逐条打成 `::error::`：工作流命令产生的注解得**无需鉴权**就能读到
        # （`/repos/{owner}/{repo}/check-runs/{id}/annotations`），失败证据从此有地方落。
        #
        # ⚠️ 只报告、不改变结论：`if: failure()` 且末尾 `exit 0`，红还是原来的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-checks.json

      - name: 回归门禁（browser：真实 Chromium + 构建产物）
        # 冒烟跑的是 dev server，跑不到"**构建产物**能不能打开"这件事。而 Web 版是每次推
        # main 自动部署的（Pages），构建成功 ≠ 打开能用：v1.84.1 踩过一次，按静态引用过滤
        # 删旧文件，把 sql.js 的 wasm / pdf worker 这类运行时才加载的资源删了——页面照开、
        # DB 初始化失败、所有查询报错。这条在 CI 里先兜住。
        run: node scripts/test-report.mjs --group browser --json test-report-browser.json

      - name: 失败时把「哪条门禁红了」变成注解（browser 组）
        # 与上面默认组那条同一个理由；这一条的**紧迫性还是它自己证明的**：
        # 2026-09-17 修好默认组之后，browser 组立刻从"被跳过"变成"真红"——
        # 也就是说它在之前每一次红里都是**被前一步掩盖**的，谁都没看到。诊断通道必须覆盖每一步，
        # 否则"哪一步先红"决定了我们能不能看见后面的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-browser.json

      - name: 上传回归报告（机器可读）
        # `if: always()`：报告在**失败那一轮**最有价值——否则"红了但没有证据"。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-checks
          path: |
            test-report-checks.json
            test-report-browser.json
          retention-days: 30

  mobile-layout:
    name: 移动端布局验收（真实 Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      # 这一档刻意用真实浏览器：侧栏/竖条的行为藏在「CSS 层叠 + matchMedia +
      # z-index + localStorage」的交叉处，happy-dom 不按视口重算媒体查询，
      # 单测覆盖不到（`.sidebar{display:flex}` 压掉 `[hidden]` 就是这类）。
      - name: 启动 web 开发服务
        run: |
          nohup pnpm dev:web > /tmp/webdev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5173/; then
              echo "dev server 就绪"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server 未在 120s 内就绪"
          cat /tmp/webdev.log
          exit 1

      # 浮层/弹窗验收接着上一条跑，同一个 dev server。
      # 挡的是三类"功能直接不可用、而且都不报错"的坏法：
      #   · `.set-dialog{min-width:640px}` 压过 `max-width` ⇒ 设置面板**关不上**；
      #   · 窄屏收起的竖条带 `transform`、成了 `position:fixed` 浮层的包含块 ⇒
      #     算好的 `left:8` 落在 -40px；
      #   · 没有滚动锁 ⇒ 浮层打开时手指拖背景把正文拖走（锁 body 无效，
      #     真正滚的是 `.note-scroll`）。
      # 视口两档（360x640 / 390x844）+ 一档桌面：后者防"窄屏规则把桌面也改成弹层"。
      - name: 移动端布局 + 浮层验收（真实 Chromium）
        run: node scripts/test-report.mjs --group mobile --json test-report-mobile.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-mobile
          path: test-report-mobile.json
          retention-days: 30

      - name: 失败时输出 dev server 日志
        if: failure()
        run: cat /tmp/webdev.log || true

  # 为什么要有这个 job：`src-tauri` 里有真正的 Rust 单测（如 plugins.rs 的 manifest
  # 校验 / 插件 id 白名单 / manifest.main 同级文件名约束），但此前**没有任何 CI 跑过
  # 它们**——上面那个 job 是纯 JS 侧检查，release.yml 只出安装包，GitCode 流水线只构建
  # .deb/.AppImage，Rust 侧回归只能靠人记得敲 `cargo test`。这里把它顶上。
  #
  # 依赖列表与 rust 工具链**照抄** release.yml 的 Linux 档：这个 crate 在 Linux 上要链
  # webkit2gtk + bundled-sqlcipher 用的 OpenSSL，少一个包都编译不过。
  # `cargo test` 编译的是 dev 档（走 tauri.conf.json 的 devUrl 分支），
  # tauri-codegen 不会去校验 `../dist`，所以这里不需要先跑前端构建 / 装 node。
  #
  # M11.13 阶段 1 起这一档是 `cargo test`（不只 `--lib`）：插件宿主的**集成测试**
  # （`src-tauri/tests/plugin_host.rs`）要起一个真的子进程——它拿 `CARGO_BIN_EXE_shuyonote`
  # 拿到应用二进制并 re-exec 自己，所以必须编译 bin target。那些断言（分流在 Tauri 之前、
  # 握手先于请求、能力通道穿得过、父进程 drop 不留孤儿）**只有在 CI 里跑才有价值**——
  # 它们正是"进程边界可用"的回归。构建时间长一点是值得的（方案 §6.2：宁可测试慢一点）。
  rust-tests:
    name: Rust 测试（cargo test，含宿主子进程集成测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: Rust 测试（cargo test，含宿主子进程集成测试）
        # 门禁清单在 `scripts/lib/gates.mjs` 的 rust 组：全量 `cargo test` + 插件模块**单独再跑一遍**
        # （2026-09-13 那类缺陷：某测试依赖进程级 APP_DATA_DIR ⇒ 单跑必红、全量反而绿，
        # 改一行只跑一条时极易误判；修法是测试自给自足，这条门禁防它回来）。
        #
        # ⚠️ 一条必须留在这里的教训：那条命令含行尾冒号（`--lib plugins::`）——YAML 的 plain scalar
        # 不允许以 `:` 结尾。若有人把它抄回本文件的 `run:` 且不加引号，整个 workflow 文件编译不过；
        # GitHub 对这种错误**不给行号、不给日志**，只产出一条 0 个 job 的红色 run（run 名是文件路径
        # 而不是 `name: CI`）——2026-09-12 起 49 次 push 全红、连纯文档提交也红，就是这一行。
        # 现在它跑在 .mjs 里，绕开了 YAML 标量规则；`check-workflow-yaml` 另有窄规则兜底。
        run: node scripts/test-report.mjs --group rust --json test-report-rust.json

      - name: 失败时把「哪条门禁红了」变成注解（rust 组）
        # 与默认组/浏览器组那两步**同一个理由**，而这一步的必要性是它自己证明的（2026-09-19）：
        # rust 组改成红之后，注解是空的、日志要 admin ⇒ 只能看到"exit code 1"，
        # **说不出是哪条门禁**（当时实际是新增的门禁在 Linux 上自动打开了"跨实现"分支）。
        # 诊断通道必须覆盖每一步，否则"哪一步先红"决定了我们能不能看见后面的红。
        if: failure()
        run: node scripts/test-report-annotate.mjs test-report-rust.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-rust
          path: test-report-rust.json
          retention-days: 30

      # 外部产物的验收：**我们打出来的包、我们签出来的索引，应用真正的解析器与校验器认不认**。
      # 两段分别在别处有测试（打包工具在 JS 侧、解析/校验在 Rust 侧），但"接起来"那段
      # 只有靠人记得敲命令——而它恰恰是最容易在改动里悄悄坏掉的一段
      # （实测过：打包从命令行 zip 换成库，字节布局变了；签名验过但解不开，只有装的时候才炸）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖（供打包工具用它自己那份 fflate）
        run: pnpm install --no-frozen-lockfile

      - name: 打一个真包（一次性密钥，只用于流水线自检）
        run: |
          node scripts/plugin-fragment.mjs \
            --plugins examples/plugins/md-outline \
            --out "$RUNNER_TEMP/frag" \
            --ephemeral-key

      - name: 应用版本进环境（片段里的 minAppVersion 就是它）
        # 取**当前**那个：填个小版本会让"可安装"这条断言变成"需要应用 X+"——
        # 我第一次就填了 1.0.0，本地演练当场抓出来。
        run: echo "SHUYONOTE_INDEX_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 外部产物验收（应用真解析器 / 真校验器）+ 打包不依赖系统 zip
        # 走注册表的 artifact 组：`--strict` 让"缺环境变量"按**失败**计——没跑不许冒充通过。
        # 其中 `plugin-fragment-no-zip` 挡的是回来路：打包**不许**再依赖命令行的 `zip`
        # （Windows 上没有它，那边 `pnpm test` 红过三条）。
        env:
          SHUYONOTE_INDEX_FIXTURE: ${{ runner.temp }}/frag/plugin-index.preview.json
          SHUYONOTE_PKG_ZIP: ${{ runner.temp }}/frag/md-outline-1.0.0.zip
          SHUYONOTE_PKG_SIG: ${{ runner.temp }}/frag/md-outline-1.0.0.zip.minisig
          SHUYONOTE_PKG_PUB: ${{ runner.temp }}/frag/publisher.pub
        run: node scripts/test-report.mjs --group artifact --strict --json test-report-artifact.json

      - name: 上传回归报告（机器可读）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-artifact
          path: test-report-artifact.json
          retention-days: 30

      # 打包不许依赖命令行 `zip` 的那条门禁已搬进注册表（artifact 组的 `plugin-fragment-no-zip`，
      # 见 scripts/lib/gates.mjs）——它在 Windows 上跑得动，不像这里的 grep 只认 Linux。
