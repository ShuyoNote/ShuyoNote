name: Release (Win/mac/Linux)

# 打 tag v* 时自动构建三平台安装包并发布一个 GitHub/GitCode Release。
# 需要配置仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（签名私钥）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
# 可选 mac 签名：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID（Apple 公证）。
# 说明：若仓库不在 GitHub，可把代码镜像到 GitHub 仓库后用本 workflow；gitcode 自带流水线只有 Linux runner（见 .gitcode/workflows/build-linux.yml）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
          # macOS 暂缓：待 Apple 签名/公证 secrets 到位后再加回（dmg,app）。
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Import Apple Developer ID cert + keychain (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          CERT="$HOME/AppleDevID.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          KEYCHAIN="$HOME/build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"
          echo "$KEYCHAIN_PASS" > "$HOME/KC_PASS"
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import "$CERT" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -lut 21600 build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          # 让 Xcode 找到该 keychain（避免 "User interaction is not allowed"）
          /usr/bin/xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Setup OpenSSL for SQLCipher (Windows)
        # rusqlite 用 bundled-sqlcipher，需链接 OpenSSL；Windows runner 无 OpenSSL，
        # 用 vcpkg 装并设 OPENSSL_DIR（mac/linux 系统自带，跳过）。
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 交付通道协议门禁（shuyonote://）
        # 这条**必须在打包之前**跑，而且不能只靠 `pnpm tauri build` 里 beforeBuildCommand 那一串：
        # 协议注册是唯一一处"配置错了不会编译失败、只在装完之后表现为点链接没反应"的地方。
        # 它查四件事，每件漏了都只表现为静默失效：
        #   1. tauri.conf.json 里 scheme 声明（→ bundler 的 deep_link_protocols → NSIS 注册表）；
        #   2. Cargo.toml 里 single-instance 的 `deep-link` feature（漏了 = 已开实例收到 URL 后丢掉）；
        #   3. lib.rs 注册插件 + 命令进 generate_handler!；
        #   4. 事件名前后端一致（对不上 = 前端永远等不到事件）。
        run: node scripts/check-deep-link.mjs

      - name: Build bundles
        # ⚠️ Windows 档**必须**保持 `nsis`：`shuyonote://` 的注册表写入（HKCU\Software\Classes）
        # 与卸载清理都在 NSIS 模板里（tauri-bundler 的 installer.nsi：安装时写，卸载时先核对
        # `shell\open\command` 确实指向本次安装的 exe 再删）。换成 msi 就得在 WiX 侧另配一份
        # 等价的注册与清理，否则会变成「装完点链接没反应」，且卸载后留下一条指向已删 exe 的键。
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mac 公证（可选）：若不用 Apple 签名则去掉这三项
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release (installers only)
        # 用 curl + GitHub API 创建 Release 并只挂三平台安装包（不依赖 gh CLI）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd artifacts
          API="https://api.github.com/repos/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          # 已存在则取 release id，否则创建（jq 兼容 API 返回的漂亮打印/紧凑 JSON）
          RID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"ShuyoNote $TAG\",\"body\":\"三平台安装包（Windows 安装版 / macOS .dmg / Linux .deb + .AppImage）。安装后可在应用内「检查更新」升级。\"}" \
              "$API/releases")
            RID=$(echo "$RESP" | jq -r '.id // empty')
            [ -z "$RID" ] && { echo "release create failed: $RESP"; exit 1; }
          fi
          # 取 upload_url（去掉模板后缀 {name,label}）
          UP=$(curl -s -H "$AUTH" "$API/releases/$RID" | jq -r '.upload_url // empty')
          UP="${UP%%\{*}"
          # 只上传安装包，不传 .so/.tar.gz 等中间产物
          found=0
          while IFS= read -r f; do
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@$f" "$UP?name=$(basename "$f")" >/dev/null
            echo "uploaded: $(basename "$f")"
            found=$((found+1))
          done < <(find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          echo "release $TAG -> $found installer(s) attached"
          [ "$found" -gt 0 ] || { echo "no installers found"; exit 1; }
