name: Release (Win/mac/Linux)

# 打 tag v* 时自动构建三平台安装包并发布一个 GitHub/GitCode Release。
# 需要配置仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（签名私钥）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
# 可选 mac 签名：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID（Apple 公证）。
# 说明：若仓库不在 GitHub，可把代码镜像到 GitHub 仓库后用本 workflow；gitcode 自带流水线只有 Linux runner（见 .gitcode/workflows/build-linux.yml）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
          - platform: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: Install frontend deps (via npmmirror for CN network)
        run: pnpm install --no-frozen-lockfile
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Setup OpenSSL for SQLCipher (Windows)
        # rusqlite 用 bundled-sqlcipher，需链接 OpenSSL；Windows runner 无 OpenSSL，
        # 用 vcpkg 装并设 OPENSSL_DIR（mac/linux 系统自带，跳过）。
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build bundles
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mac 公证（可选）：若不用 Apple 签名则去掉这三项
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release (installers only)
        # 用 gh release create（比 softprops/action-gh-release 健壮，且只挂安装包）。
        # 只把 .exe/.dmg/.deb/.AppImage 挂到 Release，不带上 bundle 里的 .so/.tar.gz 等中间产物。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          FILES=$(find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" $FILES
          else
            gh release create "${{ github.ref_name }}" \
              --title "ShuyoNote ${{ github.ref_name }}" \
              --notes "三平台安装包（Windows 安装版 / macOS .dmg / Linux .deb + .AppImage）。安装后可在应用内「检查更新」升级。" \
              $FILES
          fi
