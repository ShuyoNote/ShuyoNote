name: ci

# 为什么要有这个文件：项目主站是 GitCode，而 GitCode 侧此前**一条测试都不跑**
# ——build-linux.yml 只在打 tag 时构建 .deb/.AppImage。于是"门禁全绿"在主站完全不可见：
# 读者看到的"最近一次流水线成功"其实只是一次打包。测试只在 GitHub 镜像侧跑
# （.github/workflows/ci.yml），对主站的贡献者与用户等于不存在。
#
# 覆盖：**纯 Node 组**（契约检查 / 类型检查 / 单测 / web 冒烟 / 两设备同步 / 插件作者路径）。
# 门禁清单与 GitHub 侧**同源**——同一句 `node scripts/test-report.mjs`，同一份注册表
# （scripts/lib/gates.mjs），所以这里不会出现"两边跑的不是同一件事"。
#
# 不在这一档的（见 docs/TESTING.md 的覆盖表，那里写了为什么）：
#   · browser 组（check-pdf-reload / check-panel-layout / check-web-build）——要真实 Chromium
#   · mobile 组（布局 / 浮层验收）——要真实 Chromium + dev server
#   · rust 组（cargo test）——要 webkit2gtk 一整套系统依赖；它的读数由 rust-baseline.yml 单独产出
#
# ⚠️ 2026-09-16：本文件与 rust-baseline.yml 已通过 GitCode 自己的
#    POST /api/v8/repos/:owner/:repo/actions/workflows/validate   （valid=true）
# 三条从校验器学到的硬约束（与 GitHub 侧写法不同，别照抄 GitHub 的习惯）：
#   1) runs-on 以单个字符串给出时，只接受 [default, ubuntu-latest, euler-latest, ubuntu-24, ubuntu-22]；
#      仓库原有 build-linux.yml 用的 euleros-2.10.1 **不在**白名单里（校验器报错）。
#   2) 每个 step 都必须有非空的 name（裸 `- uses: ...` 会被拒），且名称只允许
#      中文 / 英文字母数字 / - _ , ; : . / ( ) （） / 空格 —— 全角逗号与加号都不行。
#   3) action 要用 actions/xxx@vN 形式；GitCode 简写（checkout-action@0.0.1 等）校验器报"不存在"。
#
# ⚠️ 仍未在 GitCode runner 上实跑过（本机没有 GitCode runner）。命令与 GitHub 侧逐字同源，
#    差异只在上面那三条平台约束上——它们已经用校验器验过，不再靠猜。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  checks:
    name: 单测 / 冒烟 / 契约
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm and npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@10

      - name: Install frontend deps
        run: |
          cd repo_workspace 2>/dev/null || true
          pnpm install --no-frozen-lockfile

      - name: 回归门禁（纯 Node 组, 含基线校验）
        run: |
          cd repo_workspace 2>/dev/null || true
          node scripts/test-report.mjs --group contract,smoke,sync,plugin --json test-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report.json
            repo_workspace/test-report.json
