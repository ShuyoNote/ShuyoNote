name: build-linux

# GitCode 流水线（Linux runner）。打 tag v* 时构建 Linux 包（.deb + .AppImage）。
# ⚠️ GitCode 流水线只有 Linux runner，无法构建 Windows/macOS——三平台自动发布用 GitHub Actions
# （见 .github/workflows/release.yml）。
# 启用：在 gitcode 仓库「Pipeline」页创建/启用（或 push 后自动识别 .gitcode/workflows/*.yml）。打 tag 触发。
#
# ⚠️ 这个文件 2026-09-17 之前**是坏的、且从没跑过**（据实记录，别再让它变成"看着是活的"）：
#   · GitCode 校验接口判 valid=false，4 条：runs-on 取值不在允许列表、steps[0] 没有 name、
#     steps[2] 的 name 里有 `+`（字符集不允许）、`checkout-action@0.0.1` 这种简写不被认；
#   · `/actions/artifacts` 里 **0 个 artifact** ⇒ 它从未产出过任何东西。
#   按平台三条约束改正（见下），并已用同一接口复验 valid=true。
#
# 需要仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# （Linux 更新器的 .sig 签名；**未配会打包失败**——这是 GitCode 侧唯一的失败来源）。
# 注意：本仓的正式发版**不依赖**这条流水线（GitHub Actions 出包 → release.mjs 上传到 gitcode release），
# 它只是 GitCode 侧的一条备份构建路径。

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm and npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@latest

      - name: Install rust (rustup)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Tauri Linux system deps
        run: |
          # ubuntu-24 走 apt；若在 openEuler 系 runner 上，dnf 那条会先生效（两者都留，兜底）。
          sudo dnf install -y gcc gcc-c++ make file wget curl \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel \
            openssl-devel clang libclang-devel xdg-utils 2>/dev/null || \
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: Cargo mirror (rsproxy)
        run: |
          mkdir -p ~/.cargo
          printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > ~/.cargo/config.toml

      - name: Install frontend deps
        run: cd repo_workspace && pnpm install --no-frozen-lockfile

      - name: Build Linux bundles
        run: cd repo_workspace && pnpm tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuyonote-linux
          path: repo_workspace/src-tauri/target/release/bundle/
