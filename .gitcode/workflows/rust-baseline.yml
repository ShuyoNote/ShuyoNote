name: rust-baseline

# 手动触发：只为**产出 rust 组的可信读数**（本机 Windows 上跑不了 `cargo test`——
# 测试二进制加载期即异常退出，见 docs/TESTING.md 的"已知边界"）。
#
# 为什么单独一个文件，而不是塞进 ci.yml：GitCode 侧 rust 组要装 webkit2gtk 一整套系统依赖，
# 成本高于收益，所以它**不做**推送门禁；但"给 rust 组建基线"确实需要一次 Linux 运行。
# 用独立的 workflow_dispatch 文件可以避开 GitCode 对 **job 级 `if`** 的语义依赖——
# 本机无法核实那种语义，猜错会让整个 workflow 编译不过（0 个 job 的红 run，仓库里记过这类事故）。
#
# 用法：
#   1. 在 GitCode 仓库「Pipeline」页手动运行本流水线；
#   2. 下载产物 rust-report.json；
#   3. node scripts/test-report.mjs --baseline-from rust-report.json
#      （读数值写进 tests/baseline.json；要让它**被校验**，还需在 scripts/lib/gates.mjs
#        给对应门禁补上 `baseline: true` —— 契约由人显式决定，脚本不擅自改。）
#
# ⚠️ 与 .gitcode/workflows/ci.yml 一样：本文件**尚未在 GitCode 上实跑过**（本机没有 GitCode runner）。
# 命令与 GitHub 侧同源，风险只在 GitCode 自己的 action 语义上。

on:
  workflow_dispatch:

jobs:
  rust-baseline:
    name: cargo test（产出读数，不作门禁）
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1

      - name: Install Node
        uses: setup-node@0.0.1
        with:
          node-version: "22"

      - name: Install pnpm + npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@10

      - name: Install rust (rustup)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cargo mirror (rsproxy)
        run: |
          mkdir -p ~/.cargo
          printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > ~/.cargo/config.toml

      - name: Install system deps
        # 与 release.yml / build-linux.yml 的 Linux 档保持一致：这个 crate 在 Linux 上要链
        # webkit2gtk + bundled-sqlcipher 用的 OpenSSL + mupdf 的 bindgen（libclang），少一个都编译不过。
        run: |
          sudo dnf install -y gcc gcc-c++ make file wget curl \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel \
            openssl-devel clang libclang-devel xdg-utils 2>/dev/null || \
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev xdg-utils

      - name: Install frontend deps
        run: cd repo_workspace && pnpm install --no-frozen-lockfile

      - name: cargo test（rust 组）
        # 这一步红不红不影响产出：报告在退出前就已落盘（见 scripts/test-report.mjs），
        # 读数是否存在、是否可信由下一步的产物与 --baseline-from 的输出决定。
        run: cd repo_workspace && node scripts/test-report.mjs --group rust --json rust-report.json --summary rust-summary.md

      - name: Upload report
        uses: upload-artifact@0.0.1
        with:
          name: rust-baseline-report
          path: |
            repo_workspace/rust-report.json
            repo_workspace/rust-summary.md
