## 插件索引与插件包的静态托管（数友社区）。
#
# 用法：把这个文件里的四个 location 放进 `community.shuyo.cn` 那个 server 块
# （`/etc/nginx/sites-enabled/community-shuyo.cn` 的 443 段），放在现有的 `location /` **之前**。
# 它们都是平级的精确/前缀/正则匹配，互不嵌套。
#
# ## 为什么**单开一条 `/plugins/` 路由**，而不是复用应用的 `/static/`
#
# 社区后端自己给 `/static/` 下的**所有**文件统一发了
#   cache-control: public, max-age=31536000, immutable
# （连 404 都带这个头 —— 实测 2026-09-11），且它是编译进 Rust 二进制里的，
# **没法按文件单独覆盖**。而索引恰恰是唯一一个"绝不能被长缓存"的文件：
# 索引被长缓存 = 新插件永远看不到、检查更新永远说没变化，而这类问题**发布时毫无征兆**
# （开发机一切正常，只有真实用户那边慢慢变成"怎么一直没有新插件"）。
#
# 所以按 `reply-6` 定下的判据走"单开一条路由"：由 nginx 直接发文件，每个 path 的缓存头单独写死。
#
# ## 两条缓存规矩
#
# | 文件 | 缓存 | 为什么 |
# |---|---|---|
# | `plugin-index.json` / `.minisig` | **no-store** | 见上：长缓存 = 更新永远看不到 |
# | `*.zip` / `*.zip.minisig` | immutable, 一年 | 内容不变、名字带版本号，缓存越狠越好 |
#
# ## 为什么落在 /var/www 而不是应用目录
#
# 不往 `/opt/shuyo-community/static/` 里塞：那是应用自己的静态资源目录，混进去之后
# "哪些属于应用、哪些属于插件托管"就分不清了，而应用重新部署时很容易顺手清掉它。
# 插件托管与社区应用的生命周期是**两件事**，目录上也分开。

# 1) 索引与它的签名：绝不缓存（精确匹配，避免将来被插件 id 误伤）
location = /plugins/plugin-index.json {
    alias /var/www/shuyo-plugins/plugin-index.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location = /plugins/plugin-index.json.minisig {
    alias /var/www/shuyo-plugins/plugin-index.json.minisig;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}

# 2) 插件包与发布者签名：immutable。文件名带版本号，所以"同地址内容永不变"成立；
#    同一 id 的新版本是**另一个文件名**，不会撞上这条缓存。
location ~ ^/plugins/(?<pkg>[A-Za-z0-9._-]+\.zip(?:\.minisig)?)$ {
    alias /var/www/shuyo-plugins/$pkg;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 3) 兜底：/plugins/ 下其它路径一律 404，并且**明确不要缓存** ——
#    否则一个打错的地址会被浏览器记一年，用户之后改对了也还是看不到。
location /plugins/ {
    return 404;
    add_header Cache-Control "no-store" always;
}
