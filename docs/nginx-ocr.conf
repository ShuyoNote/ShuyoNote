# ⚠️ 这是**片段源文件**，不是服务器上的活配置。
# 线上那份在 121.199.8.24:/etc/nginx/sites-enabled/shuyonote 的 443 server 块里
# （插在 `location /` 之前），备份在 /etc/nginx/backups/shuyonote.bak-ocr-*。
# 改这里不会影响线上；改线上请照 docs/plugin-hosting.md 的步骤（**必须无 BOM**，且
# `nginx -t` 之后再 reload）。
#
# ## 这是什么
#
# tesseract 的中文/英文语言包（`*.traineddata.gz`）。应用**不再把它们打进安装包**，
# 改为首次使用 OCR 时按需下载，之后由 tesseract 的 IndexedDB 缓存复用 ⇒ 之后永久离线可用。
#
# ## 为什么按需（而不是打进包）
#
# 实测（2026-09-13，见 私有仓库 `shuyonote-sync-server` 的 `docs/android-launch-plan.md` §3）：
# 语言包共 29.6 MiB，而 **Android 上它们会被装两遍** —— APK 的 `assets/` 一份，
# `.so` 里 Tauri 内嵌的前端副本里又一份（`tauri-codegen-assets` 实测 50.2 MiB，
# 其中最大的两个 .gz 正是这两个语言包）。桌面安装包同样带着它们。
#
# ## 缓存规矩
#
# | 文件 | 缓存 | 为什么 |
# |---|---|---|
# | `/ocr/tessdata/<版本>/<lang>.traineddata.gz` | **immutable，一年** | **路径里带 tessdata 版本号**，所以"同地址内容永不变"成立；换版本＝换路径 |
#
# 版本号取自 npm 包 `@tesseract.js-data/<lang>/<版本>/`——**不要**把不带版本号的路径放进来，
# 否则将来换模型时旧缓存会让用户跑着旧模型，而且看不出来。
#
# ## 两条不能踩的
#
# 1. **不要给 `.gz` 加 `Content-Encoding: gzip`**。文件本身就是 gzip 的，应用侧
#    tesseract 用 `gzip: true` 自己解压；nginx 再加一层编码头会导致**双重解压**。
#    当前全局 `gzip_types` 里没有 `application/gzip`，`gzip_static` 也没开，所以默认安全——
#    改动全局 gzip 配置时要记得这一条。
# 2. 这套文件是**静态资源**，与应用生命周期无关；放 `/var/www/shuyo-site/ocr/`（官网 docroot）
#    而不是 `/var/www/shuyo-site/app/`（那是 Web 版应用目录，重新部署时会整目录同步/清理）。

# 语言包：路径带 tessdata 版本号 ⇒ 可以长缓存
location /ocr/ {
    root /var/www/shuyo-site;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # ⚠️ **必须给 CORS**：桌面/Android 的应用壳里，页面 origin 是 `tauri://localhost`
    # （或 `http://tauri.localhost`），去取 `https://shuyo.cn/...` 是**跨域** fetch。
    # 没有这个头，模型会在 WebView 里被拦下 —— 而 **Web 版是同源、不会暴露这个问题**，
    # 于是表现为"浏览器里好好的、装上应用就不行"。这里的资源是公开静态数据，`*` 合适。
    add_header Access-Control-Allow-Origin "*" always;
    # 关掉目录列举（默认就是 off，写出来是为了别被后来的改动打开）
    autoindex off;
}
