<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="阅读：正文排版与在电脑上继续">
<title>阅读（浅色重设计 v2）</title>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;}
.t{fill:#1F2329;}.dim{fill:#646A73;}.faint{fill:#8F959E;}
.acc{fill:#3370FF;}.onacc{fill:#FFFFFF;}
.quote{font-style:italic;fill:#646A73;}
</style>
<rect x="0" y="0" width="390" height="844" rx="46" fill="#0C0D0F"/>
<rect x="6" y="6" width="378" height="832" rx="40" fill="#FFFFFF"/>
<rect x="140" y="16" width="110" height="26" rx="13" fill="#0C0D0F"/>
<text x="32" y="41" class="t" font-size="14" font-weight="600">9:41</text>
<rect x="296" y="33" width="3.5" height="5" rx="1" fill="#1F2329"/>
<rect x="301.5" y="30" width="3.5" height="8" rx="1" fill="#1F2329"/>
<rect x="307" y="27" width="3.5" height="11" rx="1" fill="#1F2329"/>
<rect x="312.5" y="24" width="3.5" height="14" rx="1" fill="#1F2329"/>
<path d="M322 34 a9 9 0 0 1 13 0" fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round"/>
<path d="M325 37.5 a4.5 4.5 0 0 1 7 0" fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round"/>
<circle cx="328.5" cy="41" r="1.5" fill="#1F2329"/>
<rect x="342" y="26" width="24" height="12" rx="3.5" fill="none" stroke="#1F2329" opacity=".5"/>
<rect x="344" y="28" width="17" height="8" rx="1.8" fill="#1F2329"/>
<rect x="367" y="29.5" width="2.5" height="5" rx="1.2" fill="#1F2329" opacity=".5"/>
<!-- 顶栏 -->
<g fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 76 L22 84 L30 92"/></g>
<text x="48" y="90" class="t" font-size="16" font-weight="600">阅读</text>
<path d="M330 78 H346 M334 84 H346 M338 90 H346" stroke="#646A73" stroke-width="1.8" stroke-linecap="round"/>
<path d="M6 108 H384" stroke="#F2F3F5"/>
<!-- 标题与元信息 -->
<text x="24" y="152" class="t" font-size="24" font-weight="700">夜景机位备忘</text>
<text x="24" y="176" class="faint" font-size="12">本机 · 更新于 12 分钟前</text>
<!-- 在电脑上继续（诚实文案：桌面↔桌面已搬通，手机↔电脑待验收） -->
<rect x="24" y="196" width="342" height="60" rx="12" fill="#EBF1FF"/>
<g transform="translate(40,212)" fill="none" stroke="#3370FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="19" height="13" rx="2"/><path d="M8 20 H16"/><path d="M12 16.4 V20"/></g>
<text x="72" y="222" class="acc" font-size="14" font-weight="600">在电脑上继续</text>
<text x="72" y="242" class="dim" font-size="11">桌面 ↔ 桌面同步已搬通 · 手机 ↔ 电脑端到端待真机验收</text>
<!-- 正文块（块级只读渲染） -->
<text x="24" y="300" class="t" font-size="20" font-weight="600">现场条件</text>
<text x="24" y="334" class="t" font-size="16">天桥西侧光比很大，护栏会反光。</text>
<text x="24" y="364" class="t" font-size="16">广角低机位，机身尽量贴住栏杆。</text>
<text x="24" y="394" class="t" font-size="16">备用机位：桥下人行道，长焦补特写。</text>
<!-- 引用块 -->
<rect x="24" y="424" width="342" height="76" rx="10" fill="#F7F8FA"/>
<rect x="24" y="424" width="3" height="76" rx="1.5" fill="#3370FF"/>
<text x="44" y="456" class="quote" font-size="15">导演要求：三个角度各拍一条，</text>
<text x="44" y="482" class="quote" font-size="15">第二条要保留环境声。</text>
<!-- 图片占位 -->
<rect x="24" y="524" width="342" height="140" rx="10" fill="#F7F8FA" stroke="#D4D8DF" stroke-dasharray="6 4"/>
<g fill="none" stroke="#8F959E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="164" y="558" width="62" height="46" rx="5"/><circle cx="182" cy="574" r="5"/><path d="M166 598 L188 578 L200 589 L210 580 L224 594"/></g>
<text x="195" y="636" class="faint" font-size="12" text-anchor="middle">图片占位 · 机位示意</text>
<text x="24" y="700" class="t" font-size="16">回到电脑端可补充分镜与场记。</text>
<!-- 页脚 -->
<path d="M24 724 H366" stroke="#F2F3F5"/>
<text x="24" y="748" class="faint" font-size="11">本页共 6 块 · 本机已保存</text>
<text x="24" y="766" class="faint" font-size="11">块级只读接口暂不返回引用/图片结构 ⇒ 引用与图片按占位渲染，不伪造。</text>
<rect x="145" y="820" width="100" height="5" rx="2.5" fill="#1F2329" opacity=".18"/>
</svg>
