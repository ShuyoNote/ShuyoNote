<text x="48" y="90" class="t" font-size="16" font-weight="600">阅读</text>
<text x="24" y="152" class="t" font-size="24" font-weight="700">夜景机位备忘</text>
<text x="24" y="176" class="faint" font-size="12">本机 · 更新于 12 分钟前</text>
