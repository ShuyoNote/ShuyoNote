<text x="24" y="304" class="t" font-size="16">the reflection 会吃掉高光，</text>
<rect x="164" y="288" width="98" height="22" rx="4" fill="#FFE08A" opacity=".6"/>
<circle cx="163" cy="299" r="4" fill="#3370FF"/>
<circle cx="263" cy="299" r="4" fill="#3370FF"/>
