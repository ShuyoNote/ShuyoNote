<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="设备直连：筛选、同步状态与附近设备">
<title>设备直连（浅色重设计 v2）</title>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;}
.mono{font-family:'SF Mono','JetBrains Mono',Consolas,monospace;}
.t{fill:#1F2329;}.dim{fill:#646A73;}.faint{fill:#8F959E;}
.acc{fill:#3370FF;}.onacc{fill:#FFFFFF;}
.ok{fill:#00B578;}.warn{fill:#B25E00;}.dang{fill:#F54A45;}
</style>
<rect x="0" y="0" width="390" height="844" rx="46" fill="#0C0D0F"/>
<rect x="6" y="6" width="378" height="832" rx="40" fill="#FFFFFF"/>
<rect x="140" y="16" width="110" height="26" rx="13" fill="#0C0D0F"/>
<text x="32" y="41" class="t" font-size="14" font-weight="600">9:41</text>
<rect x="296" y="33" width="3.5" height="5" rx="1" fill="#1F2329"/>
<rect x="301.5" y="30" width="3.5" height="8" rx="1" fill="#1F2329"/>
<rect x="307" y="27" width="3.5" height="11" rx="1" fill="#1F2329"/>
<rect x="312.5" y="24" width="3.5" height="14" rx="1" fill="#1F2329"/>
<path d="M322 34 a9 9 0 0 1 13 0" fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round"/>
<path d="M325 37.5 a4.5 4.5 0 0 1 7 0" fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round"/>
<circle cx="328.5" cy="41" r="1.5" fill="#1F2329"/>
<rect x="342" y="26" width="24" height="12" rx="3.5" fill="none" stroke="#1F2329" opacity=".5"/>
<rect x="344" y="28" width="17" height="8" rx="1.8" fill="#1F2329"/>
<rect x="367" y="29.5" width="2.5" height="5" rx="1.2" fill="#1F2329" opacity=".5"/>
<!-- 顶栏 -->
<g fill="none" stroke="#1F2329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 76 L22 84 L30 92"/></g>
<text x="195" y="90" class="t" font-size="16" font-weight="600" text-anchor="middle">设备直连</text>
<path d="M330 78 H346 M334 84 H346 M338 90 H346" stroke="#646A73" stroke-width="1.8" stroke-linecap="round"/>
<!-- 加密告警 -->
<rect x="24" y="108" width="342" height="60" rx="12" fill="#FFF3CC"/>
<g transform="translate(40,122)" fill="none" stroke="#B25E00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 L19 17 H1 Z"/><path d="M10 8 V12"/><circle cx="10" cy="14.6" r=".9" fill="#B25E00" stroke="none"/></g>
<text x="70" y="132" class="t" font-size="13" font-weight="600">本机有 3 个空间未开加密 → 内容会在局域网上明文传输</text>
<text x="70" y="152" class="warn" font-size="11">加密开关在桌面端 · 手机上不放假入口</text>
<!-- 本机同步状态 -->
<rect x="24" y="184" width="342" height="96" rx="14" fill="#F7F8FA" stroke="#E5E8EE"/>
<text x="44" y="214" class="t" font-size="15" font-weight="600">本机同步状态</text>
<text x="44" y="238" class="dim" font-size="12"><tspan class="mono">已配对 1 台 · fetched=8 · applied=8 · cursor 正常</tspan></text>
<text x="44" y="260" class="faint" font-size="11">上次成功时间：暂无读数 · 失败不吞，原样转述后端读数</text>
<!-- 筛选胶囊（计数同源） -->
<rect x="24" y="296" width="88" height="32" rx="16" fill="#3370FF"/>
<text x="68" y="317" class="onacc" font-size="13" font-weight="600" text-anchor="middle">已配对 1</text>
<rect x="122" y="296" width="88" height="32" rx="16" fill="#F7F8FA" stroke="#E5E8EE"/>
<text x="166" y="317" class="dim" font-size="13" text-anchor="middle">要重配 1</text>
<rect x="220" y="296" width="88" height="32" rx="16" fill="#F7F8FA" stroke="#E5E8EE"/>
<text x="264" y="317" class="dim" font-size="13" text-anchor="middle">附近 1</text>
<!-- 设备卡 1：已配对（不渲染「立即同步」：按空间同步，挂单台会指错） -->
<rect x="24" y="344" width="342" height="106" rx="14" fill="#FFFFFF" stroke="#E5E8EE"/>
<text x="44" y="374" class="t" font-size="17" font-weight="600">MacBook · 客厅</text>
<text x="44" y="396" class="dim" font-size="12">192.168.43.21 · 上次同步 12 分钟前 · 今天 42 项</text>
<rect x="44" y="408" width="54" height="22" rx="11" fill="#E7F8F1"/>
<text x="71" y="423" class="ok" font-size="11" text-anchor="middle">✓ 双向</text>
<rect x="106" y="408" width="74" height="22" rx="11" fill="#E7F8F1"/>
<text x="143" y="423" class="ok" font-size="11" text-anchor="middle">✓ 自动同步</text>
<!-- 设备卡 2：钥匙不匹配 -->
<rect x="24" y="462" width="342" height="128" rx="14" fill="#FFFFFF" stroke="#E5E8EE"/>
<text x="44" y="492" class="t" font-size="17" font-weight="600">AMD · 书房台</text>
<text x="44" y="514" class="dim" font-size="12">192.168.43.51 · 对方换过钥匙 → 旧信任已失效</text>
<rect x="44" y="524" width="88" height="22" rx="11" fill="#FDECEC"/>
<text x="88" y="539" class="dang" font-size="11" text-anchor="middle">✕ 钥匙不匹配</text>
<rect x="44" y="550" width="302" height="28" rx="14" fill="#3370FF"/>
<text x="195" y="569" class="onacc" font-size="13" font-weight="600" text-anchor="middle">重新配对</text>
<!-- 设备卡 3：未配对 -->
<rect x="24" y="602" width="342" height="128" rx="14" fill="#FFFFFF" stroke="#E5E8EE"/>
<text x="44" y="632" class="t" font-size="17" font-weight="600">Pixel · 手机</text>
<text x="44" y="654" class="dim" font-size="12">192.168.43.44 · 未配对 · 正在广播</text>
<rect x="44" y="664" width="66" height="22" rx="11" fill="#F2F3F5"/>
<text x="77" y="679" class="dim" font-size="11" text-anchor="middle">未配对</text>
<rect x="44" y="690" width="302" height="28" rx="14" fill="#3370FF"/>
<text x="195" y="709" class="onacc" font-size="13" font-weight="600" text-anchor="middle">接入</text>
<!-- 页脚 -->
<path d="M24 748 H366" stroke="#F2F3F5"/>
<text x="24" y="770" class="faint" font-size="10">附近没找到别的设备？两台要在同一个网络里（也没开「AP 隔离」）。</text>
<text x="24" y="786" class="faint" font-size="10">示意文案：IP 与设备名均为占位 · 不显示 device_id · 点「接入 / 重新配对」进首次配对屏。</text>
<rect x="145" y="820" width="100" height="5" rx="2.5" fill="#1F2329" opacity=".18"/>
</svg>
