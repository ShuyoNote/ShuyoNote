<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShuyoNote 移动端 UI 重设计 · 2026-10-20（浅色明快卡片版）</title>
<style>
  body{margin:0;background:#F2F3F5;font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#1F2329;}
  header{padding:32px 40px 8px;}
  h1{font-size:22px;margin:0 0 6px;}
  .sub{color:#646A73;font-size:13px;line-height:1.7;margin:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;padding:28px 40px 56px;}
  figure{margin:0;background:#fff;border:1px solid #E5E8EE;border-radius:16px;padding:16px;}
  figcaption{margin-top:12px;font-size:13px;font-weight:600;}
  figcaption small{display:block;font-weight:400;color:#8F959E;margin-top:4px;line-height:1.6;}
  img{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 4px 16px rgba(16,24,40,.10);}
  .note{margin:0 40px 8px;padding:12px 16px;background:#FFF3CC;border-radius:10px;font-size:12.5px;color:#1F2329;line-height:1.8;}
</style>
</head>
<body>
<header>
  <h1>ShuyoNote 移动端 UI 重设计 · 浅色明快卡片版</h1>
  <p class="sub">2026-10-20 · 10 屏 · 390×844 · 浅色 token（design-system 浅色列）· 对齐 2026-10-19 底边栏导航 · 效果图 ≠ 已做</p>
</header>
<p class="note">05 待办已拍不做（R196），本套不含。所有屏内文案均为示意占位；同步/配对文案按需求「诚实呈现」口径书写。</p>
<div class="grid">
  <figure><img src="01-home.svg" alt="首页"><figcaption>01 首页<small>快速记录渐变主卡 + 搜索入口 + 最近笔记；底边栏「笔记」选中 + 浮「＋」</small></figcaption></figure>
  <figure><img src="02-capture.svg" alt="快速记录"><figcaption>02 快速记录<small>标题 + 「存」；键盘上方 6 项工具栏；草稿保存在本机</small></figcaption></figure>
  <figure><img src="03-search.svg" alt="搜索"><figcaption>03 搜索<small>聚焦框 + 两档命中高亮；标题/正文筛选 disabled 写明原因</small></figcaption></figure>
  <figure><img src="04-read.svg" alt="阅读"><figcaption>04 阅读<small>按块类型渲染（标题/列表/引用/callout/图片）；图片有 src 真画、死链退占位；同步文案如实</small></figcaption></figure>
  <figure><img src="06-dict.svg" alt="划词查词"><figcaption>06 划词查词<small>英文词选中浮出释义卡；加入词库 disabled；释义来源本机词典（英汉）</small></figcaption></figure>
  <figure><img src="07-settings.svg" alt="我的"><figcaption>07 我的 / 设置<small>账户 + 同步（上次成功时间暂无读数）+ 空间包 + 外观 + 关于 + 高级指向桌面端</small></figcaption></figure>
  <figure><img src="07b-settings-space-native.svg" alt="设置空间卡（原生档）"><figcaption>07b 设置 · 空间（原生档）<small>导出当前空间 / 导入空间包；导入成功自动切到新空间</small></figcaption></figure>
  <figure><img src="07c-settings-space-web.svg" alt="设置空间卡（Web档）"><figcaption>07c 设置 · 空间（Web 档）<small>没有配对同步卡；脚注说明 Web 不提供多设备同步</small></figcaption></figure>
  <figure><img src="08-pair.svg" alt="设备直连"><figcaption>08 设备直连<small>加密黄条 + 后端读数原样转述 + 三档筛选；无「立即同步」；不显示 device_id</small></figcaption></figure>
  <figure><img src="08b-paircode.svg" alt="首次配对"><figcaption>08b 首次配对<small>20 位对码 5×4；对不上一律不建立信任；没有自动通过</small></figcaption></figure>
  <figure><img src="09-splash.svg" alt="启动页"><figcaption>09 启动页<small>浅色光晕 + 渐变图标 + 进度条；图内示例版号 1.92.21，实现版号 1.92.24</small></figcaption></figure>
  <figure><img src="10-about.svg" alt="关于"><figcaption>10 关于<small>许可 AGPL-3.0 / 组件 12 项 / 链接仅官网与社区；隐私政策与备案号待填</small></figcaption></figure>
</div>
</body>
</html>
