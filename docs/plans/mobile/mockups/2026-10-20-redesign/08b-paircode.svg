<text x="195" y="486" class="dim" font-size="12" text-anchor="middle">20 位 · 5 组 × 4 位 ｜ 两台必须一模一样</text>
<!-- 信任警示 -->
<rect x="24" y="506" width="342" height="88" rx="12" fill="#FFF3CC"/>
<g transform="translate(40,520)" fill="none" stroke="#B25E00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 L19 17 H1 Z"/><path d="M10 8 V12"/><circle cx="10" cy="14.6" r=".9" fill="#B25E00" stroke="none"/></g>
<text x="70" y="532" class="t" font-size="12.5" font-weight="600">对不上一律不建立信任（本机一个字都不收）</text>
<text x="70" y="554" class="warn" font-size="11.5">两串不一样 → 多半是中间有人在替它应答，</text>
<text x="70" y="572" class="warn" font-size="11.5">或两台不在同一个网络 → 取消、重连网络。</text>
<!-- 动作 -->
<rect x="24" y="620" width="160" height="48" rx="12" fill="#F2F3F5"/>
<text x="104" y="650" class="t" font-size="15" font-weight="600" text-anchor="middle">取消</text>
<rect x="206" y="620" width="160" height="48" rx="12" fill="#3370FF"/>
<text x="286" y="650" class="onacc" font-size="15" font-weight="600" text-anchor="middle">码对得上，确认</text>
<!-- 诚实说明 -->
<g transform="translate(120,700)" fill="none" stroke="#D9A300" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1 L10.2 6 L15.5 6.4 L11.5 10 L12.8 15.2 L8 12.4 L3.2 15.2 L4.5 10 L0.5 6.4 L5.8 6 Z"/></g>
<text x="195" y="730" class="dim" font-size="12" text-anchor="middle">这一步没有「自动通过」：每一次都必须由人点一下。</text>
<text x="195" y="752" class="faint" font-size="11" text-anchor="middle">code 为 null 时如实显示 reason，不渲染空格子。</text>
<text x="195" y="772" class="faint" font-size="10" text-anchor="middle">示意码：对码为效果图占位内容，非任何真实配对码。</text>
