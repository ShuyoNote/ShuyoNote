<!-- 正文输入区 -->
<text x="28" y="196" class="t" font-size="16">天桥西侧光比很大，护栏会反光。</text>
<text x="28" y="228" class="t" font-size="16">广角低机位，机身尽量贴住栏杆。</text>
<text x="28" y="260" class="t" font-size="16">备用机位：桥下人行道，长焦补特写。</text>
<rect x="254" y="268" width="2" height="20" fill="#3370FF"/>
