<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3370ff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShuyoNote" />
    <title>ShuyoNote 数友笔记</title>
    <style>
      /* Splash is intentionally self-contained (no external CSS) so it paints
         the instant the HTML document is parsed — before the app JS bundle
         loads. It's a sibling of #root and gets faded out on app mount. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(120% 120% at 20% 10%, rgba(103, 150, 255, 0.35), transparent 55%),
          radial-gradient(120% 120% at 85% 90%, rgba(41, 82, 204, 0.55), transparent 60%),
          linear-gradient(135deg, #0b1533 0%, #16224d 48%, #1b2f6e 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.is-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 12px 40px rgba(51, 112, 255, 0.45));
        animation: splashBreath 2.4s ease-in-out infinite;
      }
      @keyframes splashBreath {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.07); }
      }
      .splash-logo svg { display: block; width: 100%; height: 100%; }
      .splash-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        letter-spacing: 1px;
      }
      .splash-brand {
        font-size: 30px;
        font-weight: 700;
        background: linear-gradient(90deg, #fff, #bcd0ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splashFadeUp 0.9s ease both;
      }
      .splash-sub {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.62);
        animation: splashFadeUp 0.9s 0.15s ease both;
      }
      .splash-bar {
        width: 200px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5a8bff, #9db8ff);
        animation: splashSlide 1.2s ease-in-out infinite;
      }
      @keyframes splashSlide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(420%); }
      }
      @keyframes splashFadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-logo,
        #app-splash .splash-bar::after { animation: none; }
        #app-splash .splash-brand,
        #app-splash .splash-sub { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-label="正在启动 ShuyoNote">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ShuyoNote">
          <defs>
            <linearGradient id="splashG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5a8bff"/>
              <stop offset="1" stop-color="#2952cc"/>
            </linearGradient>
          </defs>
          <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#splashG)"/>
          <rect x="128" y="112" width="256" height="288" rx="38" fill="#ffffff"/>
          <rect x="176" y="182" width="128" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="234" width="152" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="286" width="152" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="338" width="88" height="22" rx="11" fill="#c9d6ff"/>
        </svg>
      </div>
      <div class="splash-title">
        <div class="splash-brand">ShuyoNote</div>
        <div class="splash-sub">数友笔记 · 本地优先</div>
      </div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
