<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3370ff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShuyoNote" />
    <title>ShuyoNote 数友笔记</title>
    <script>
      // Self-heal legacy Service Worker / caches BEFORE any bundle loads. A stale
      // SW from an older build can serve an old index.html that references hashed
      // assets no longer present after an update → JS 404 → the app never mounts
      // and the splash screen stays forever. This inline script runs during HTML
      // parse (before the app JS bundle), so even a page served by a stale SW will
      // unregister it, clear caches, and force one reload onto the fresh bundle.
      (function () {
        try {
          var hadSw = false;
          var isTauri = typeof window !== "undefined" && "__TAURI_INTERNALS__" in window;
          var host = window.location.hostname;
          var isLocal = host === "localhost" || host === "127.0.0.1" || host === "tauri.localhost";
          // Only self-heal in local/desktop hosts (where we deliberately never keep
          // a SW). A real production web domain keeps its offline PWA.
          if (("serviceWorker" in navigator) && isLocal) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              hadSw = regs.length > 0 || !!navigator.serviceWorker.controller;
              return Promise.all(regs.map(function (r) { return r.unregister().catch(function () { return false; }); }));
            }).then(function () {
              if (window.caches && window.caches.keys) {
                return window.caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return window.caches.delete(k).catch(function () { return false; }); }));
                });
              }
            }).then(function () {
              if (hadSw && window.location.search.indexOf("swreload") === -1) {
                var u = new URL(window.location.href);
                u.searchParams.set("swreload", "1");
                window.location.replace(u.toString());
              }
            }).catch(function () {});
          }
        } catch (e) { /* never block the app */ }
      })();

      // Boot-diagnostic (runs even if the main bundle fails): if the app bundle
      // didn't mount into #root within a deadline, surface the failing resource /
      // error on the splash. Resource-load failures (404 of a hashed asset) do
      // NOT trigger window.onerror, so we capture them via the capture phase.
      (function () {
        var failed = [];
        function onResErr(e) {
          var t = e.target;
          var src = (t && (t.src || t.href)) || "";
          if (src && failed.indexOf(src) === -1) failed.push(src);
        }
        try { window.addEventListener("error", onResErr, true); } catch (e) {}
        function showDiagnostic() {
          var root = document.getElementById("root");
          var booted = root && root.childElementCount > 0 && !document.getElementById("app-splash");
          if (booted) return;
          var el = document.getElementById("app-splash");
          if (!el || el.classList.contains("is-hide")) return;
          var msg = "";
          if (failed.length) {
            msg = "主 bundle 或资源加载失败（可能是残留缓存/旧版本）：<br/>" + failed.map(function (s) { return escapeHtml(s); }).join("<br/>");
          } else {
            msg = "主 bundle 未执行（#root 为空）。若此前曾注册过 Service Worker 或缓存残留，请清 WebView 缓存或重装后重试。<br/>请截图此信息反馈。";
          }
          el.innerHTML = '<div style="max-width:640px;margin:24px;padding:20px 22px;border-radius:12px;background:#1c2340;border:1px solid rgba(255,255,255,.18);text-align:left;font-family:Segoe UI,system-ui,sans-serif;color:#fff">' +
            '<div style="font-weight:700;margin-bottom:10px;color:#ffb3b3">启动错误</div>' +
            '<div style="font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;color:rgba(255,255,255,.85)">' + msg + '</div>' +
            '<div style="margin-top:14px;font-size:12px;color:rgba(255,255,255,.6)">请截图此信息反馈。</div></div>';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        // Wait for DOM to be parsed, then check after a short grace period.
        function check() { setTimeout(showDiagnostic, 2500); }
        if (document.readyState === "complete" || document.readyState === "interactive") check();
        else document.addEventListener("DOMContentLoaded", check);
      })();
    </script>
    <style>
      /* Splash is intentionally self-contained (no external CSS) so it paints
         the instant the HTML document is parsed — before the app JS bundle
         loads. It's a sibling of #root and gets faded out on app mount. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(120% 120% at 20% 10%, rgba(103, 150, 255, 0.35), transparent 55%),
          radial-gradient(120% 120% at 85% 90%, rgba(41, 82, 204, 0.55), transparent 60%),
          linear-gradient(135deg, #0b1533 0%, #16224d 48%, #1b2f6e 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.is-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 12px 40px rgba(51, 112, 255, 0.45));
        animation: splashBreath 2.4s ease-in-out infinite;
      }
      @keyframes splashBreath {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.07); }
      }
      .splash-logo svg { display: block; width: 100%; height: 100%; }
      .splash-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        letter-spacing: 1px;
      }
      .splash-brand {
        font-size: 30px;
        font-weight: 700;
        background: linear-gradient(90deg, #fff, #bcd0ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splashFadeUp 0.9s ease both;
      }
      .splash-sub {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.62);
        animation: splashFadeUp 0.9s 0.15s ease both;
      }
      .splash-bar {
        width: 200px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #5a8bff, #9db8ff);
        animation: splashSlide 1.2s ease-in-out infinite;
      }
      @keyframes splashSlide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(420%); }
      }
      @keyframes splashFadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-logo,
        #app-splash .splash-bar::after { animation: none; }
        #app-splash .splash-brand,
        #app-splash .splash-sub { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-label="正在启动 ShuyoNote">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ShuyoNote">
          <defs>
            <linearGradient id="splashG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5a8bff"/>
              <stop offset="1" stop-color="#2952cc"/>
            </linearGradient>
          </defs>
          <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#splashG)"/>
          <rect x="128" y="112" width="256" height="288" rx="38" fill="#ffffff"/>
          <rect x="176" y="182" width="128" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="234" width="152" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="286" width="152" height="22" rx="11" fill="#c9d6ff"/>
          <rect x="176" y="338" width="88" height="22" rx="11" fill="#c9d6ff"/>
        </svg>
      </div>
      <div class="splash-title">
        <div class="splash-brand">ShuyoNote</div>
        <div class="splash-sub">数友笔记 · 本地优先</div>
      </div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
