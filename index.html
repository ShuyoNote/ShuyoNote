<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3370ff" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShuyoNote" />
    <title>ShuyoNote 数友笔记</title>
    <!-- Prism global (plain synchronous scripts, before any module) so that
         @lexical/code's bare `Prism` references resolve to window.Prism instead
         of an ESM-bundled copy that is never set as global. -->
    <script src="prism/prism-core.js"></script>
    <script src="prism/prism-markup.js"></script>
    <script src="prism/prism-clike.js"></script>
    <script src="prism/prism-javascript.js"></script>
    <script src="prism/prism-markup-templating.js"></script>
    <script src="prism/prism-css.js"></script>
    <script src="prism/prism-bash.js"></script>
    <script src="prism/prism-python.js"></script>
    <script src="prism/prism-typescript.js"></script>
    <script>
      // Self-heal legacy Service Worker / caches BEFORE any bundle loads. A stale
      // SW from an older build can serve an old index.html that references hashed
      // assets no longer present after an update → JS 404 → the app never mounts
      // and the splash screen stays forever. This inline script runs during HTML
      // parse (before the app JS bundle), so even a page served by a stale SW will
      // unregister it, clear caches, and force one reload onto the fresh bundle.
      (function () {
        try {
          var hadSw = false;
          var isTauri = typeof window !== "undefined" && "__TAURI_INTERNALS__" in window;
          var host = window.location.hostname;
          var isLocal = host === "localhost" || host === "127.0.0.1" || host === "tauri.localhost";
          // Only self-heal in local/desktop hosts (where we deliberately never keep
          // a SW). A real production web domain keeps its offline PWA.
          if (("serviceWorker" in navigator) && isLocal) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              hadSw = regs.length > 0 || !!navigator.serviceWorker.controller;
              return Promise.all(regs.map(function (r) { return r.unregister().catch(function () { return false; }); }));
            }).then(function () {
              if (window.caches && window.caches.keys) {
                return window.caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return window.caches.delete(k).catch(function () { return false; }); }));
                });
              }
            }).then(function () {
              if (hadSw && window.location.search.indexOf("swreload") === -1) {
                var u = new URL(window.location.href);
                u.searchParams.set("swreload", "1");
                window.location.replace(u.toString());
              }
            }).catch(function () {});
          }
        } catch (e) { /* never block the app */ }
      })();

      // Boot-diagnostic (runs even if the main bundle fails): if the app bundle
      // didn't mount into #root within a deadline, surface the failing resource /
      // runtime error on the splash. Resource-load failures do NOT trigger
      // window.onerror, so we capture them via the capture phase; runtime errors
      // during bundle evaluation DO trigger window.onerror.
      (function () {
        var failed = [];
        var rtErr = "";
        function onResErr(e) {
          var t = e.target;
          var src = (t && (t.src || t.href)) || "";
          if (src && failed.indexOf(src) === -1) failed.push(src);
        }
        function onRtErr(e) {
          // e.message is the runtime error; capture the first one.
          if (!rtErr) rtErr = (e && (e.message || (e.error && e.error.message))) || String(e || "");
        }
        try { window.addEventListener("error", onResErr, true); } catch (e) {}
        try { window.addEventListener("error", onRtErr); } catch (e) {}
        function showDiagnostic() {
          var root = document.getElementById("root");
          var booted = root && root.childElementCount > 0 && !document.getElementById("app-splash");
          if (booted) return;
          var el = document.getElementById("app-splash");
          if (!el || el.classList.contains("is-hide")) return;
          var parts = [];
          if (failed.length) parts.push("失败的资源：<br/>" + failed.map(function (s) { return escapeHtml(s); }).join("<br/>"));
          if (rtErr) parts.push("运行时错误：" + escapeHtml(rtErr));
          var msg = parts.length
            ? parts.join("<br/><br/>")
            : "主 bundle 未执行（#root 为空），且未捕获到资源/运行时错误。可能为主 JS 未开始加载或协议层问题。<br/>请截图此信息反馈。";
          el.innerHTML = '<div style="max-width:640px;margin:24px;padding:20px 22px;border-radius:12px;background:#1c2340;border:1px solid rgba(255,255,255,.18);text-align:left;font-family:Segoe UI,system-ui,sans-serif;color:#fff">' +
            '<div style="font-weight:700;margin-bottom:10px;color:#ffb3b3">启动错误</div>' +
            '<div style="font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all;color:rgba(255,255,255,.85)">' + msg + '</div>' +
            '<div style="margin-top:14px;font-size:12px;color:rgba(255,255,255,.6)">请截图此信息反馈。</div></div>';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function check() { setTimeout(showDiagnostic, 2600); }
        if (document.readyState === "complete" || document.readyState === "interactive") check();
        else document.addEventListener("DOMContentLoaded", check);
      })();
    </script>
    <style>
      /* Splash is intentionally self-contained (no external CSS) so it paints
         the instant the HTML document is parsed — before the app JS bundle
         loads. It's a sibling of #root and gets faded out on app mount. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(80% 60% at 18% 8%, rgba(94, 139, 255, 0.28), transparent 60%),
          radial-gradient(70% 55% at 85% 92%, rgba(41, 82, 204, 0.55), transparent 60%),
          linear-gradient(135deg, #0a1026 0%, #101c3f 52%, #152a5e 100%);
        overflow: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      /* 动态网格 + 环绕光带，增强科技感 */
      #app-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(120, 150, 220, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 150, 220, 0.07) 1px, transparent 1px);
        background-size: 54px 54px;
        -webkit-mask-image: radial-gradient(75% 75% at 50% 44%, #000 25%, transparent 100%);
        mask-image: radial-gradient(75% 75% at 50% 44%, #000 25%, transparent 100%);
      }
      #app-splash::after {
        content: "";
        position: absolute;
        inset: -60%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(94, 139, 255, 0.14) 70deg, transparent 150deg, rgba(41, 82, 204, 0.12) 250deg, transparent 330deg);
        animation: splashOrbit 14s linear infinite;
      }
      @keyframes splashOrbit { to { transform: rotate(360deg); } }
      #app-splash.is-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 116px;
        height: 116px;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 14px 46px rgba(51, 112, 255, 0.55));
        animation: splashBreath 2.6s ease-in-out infinite;
      }
      .splash-logo::before {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(94, 139, 255, 0.5), transparent 72%);
        animation: splashGlow 3s ease-in-out infinite;
      }
      @keyframes splashBreath {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.06); }
      }
      @keyframes splashGlow {
        0%, 100% { opacity: 0.5; transform: scale(0.96); }
        50%      { opacity: 0.9; transform: scale(1.06); }
      }
      .splash-logo svg { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }
      .splash-title {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        letter-spacing: 1px;
      }
      .splash-brand {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #ffffff 0%, #bcd0ff 30%, #ffffff 55%, #bcd0ff 80%, #ffffff 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splashShine 3.2s linear infinite, splashFadeUp 0.9s ease both;
      }
      @keyframes splashShine {
        0%   { background-position: 120% 0; }
        100% { background-position: -120% 0; }
      }
      .splash-sub {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.62);
        animation: splashFadeUp 0.9s 0.15s ease both;
      }
      .splash-bar {
        width: 220px;
        height: 5px;
        position: relative;
        z-index: 1;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        overflow: hidden;
        box-shadow: 0 0 16px rgba(94, 139, 255, 0.4);
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f8cff, #7fb0ff, #4f8cff);
        background-size: 200% 100%;
        animation: splashSlide 1.3s ease-in-out infinite;
      }
      @keyframes splashSlide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(420%); }
      }
      @keyframes splashFadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash::after { animation: none; }
        #app-splash .splash-logo,
        #app-splash .splash-logo::before,
        #app-splash .splash-bar::after { animation: none; }
        #app-splash .splash-brand,
        #app-splash .splash-sub { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" role="status" aria-label="正在启动 ShuyoNote">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ShuyoNote">
          <defs>
            <linearGradient id="splashG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4D8DFF"/>
              <stop offset="1" stop-color="#2952CC"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#splashG)"/>
          <rect x="248" y="318" width="250" height="388" rx="42" fill="#FFFFFF"/>
          <rect x="526" y="318" width="250" height="388" rx="42" fill="#FFFFFF"/>
          <rect x="290" y="388" width="166" height="18" rx="9" fill="#C7D6FF"/>
          <rect x="290" y="450" width="166" height="18" rx="9" fill="#C7D6FF"/>
          <rect x="290" y="512" width="118" height="18" rx="9" fill="#C7D6FF"/>
          <rect x="568" y="388" width="166" height="18" rx="9" fill="#C7D6FF"/>
          <rect x="568" y="450" width="166" height="18" rx="9" fill="#C7D6FF"/>
          <rect x="568" y="512" width="118" height="18" rx="9" fill="#C7D6FF"/>
          <path d="M 770 238 Q 775.4 262.6, 800 268 Q 775.4 273.4, 770 298 Q 764.6 273.4, 740 268 Q 764.6 262.6, 770 238 Z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="splash-title">
        <div class="splash-brand">ShuyoNote</div>
        <div class="splash-sub">数友笔记 · 本地优先</div>
      </div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
