[package]
name = "shuyonote"
version = "1.59.178"
description = "A local-first Notion-like note app"
authors = ["you"]
edition = "2021"
# MSRV（最小支持版本）：与文档声明的 "1.94+" 对齐；不锁工具链，仅声明最低 Rust 版本。
# 若要更严格复现，可另加 rust-toolchain.toml 钉 channel（默认不钉，跟随 stable）。
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shuyonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha2 = "0.11"
regex = "1"
zip = "8"
boa_engine = "0.21.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.5.3"
# rand_core stays on 0.6: the crypto tree (chacha20poly1305 0.11 / argon2 0.5)
# is already at latest and pins rand_core 0.6; lifting it forges a second
# RngCore trait and breaks OsRng usage.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23.1"
tauri-plugin-updater = "2.10.1"
# M24 desktop-native PDF render: use mupdf-sys (compiles cleanly on MSVC) rather
# than the high-level `mupdf` crate, whose safe wrapper has an MSVC compile bug
# (bindgen does not emit `max_align_t`). We call the `mupdf_*` convenience API
# via src/pdf_native.rs.
mupdf-sys = "0.8.0"
png = "0.18.1"

[dev-dependencies]
# For async integration tests (embed_text network round-trip / search_semantic ranking).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
