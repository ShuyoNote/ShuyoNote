[package]
name = "shuyonote"
version = "1.89.0"
description = "A local-first Notion-like note app"
authors = ["you"]
edition = "2021"
# MSRV（最低支持版本）：与文档声明的 "1.94+" 对齐；不锁工具链，跟随 stable，仅声明最低 Rust 版本。如需更严格环境可另加 rust-toolchain.toml 锁 channel（默认不锁）。
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shuyonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha2 = "0.11"
regex = "1"
zip = "8"
hex = "0.4"
# 索引签名（minisign）：与 updater 同一套习惯，只做校验（不内置任何"官方公钥"）。
minisign-verify = "0.2"
# RSS 看门狗读子进程常驻内存：Linux 要页大小（sysconf），macOS 走 proc_pidinfo。
# 它本来就在依赖树里（随 rusqlite/tokio 进来），这里只是显式声明。
libc = "0.2"
boa_engine = "0.21.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.5.3"
# rand_core stays on 0.6: the crypto tree (chacha20poly1305 0.11 / argon2 0.5)
# is already at latest and pins rand_core 0.6; lifting it forges a second
# RngCore trait and breaks OsRng usage.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23.1"
percent-encoding = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "2"
# M24 desktop-native PDF render: use mupdf-sys (compiles cleanly on MSVC) rather
# than the high-level `mupdf` crate, whose safe wrapper has an MSVC compile bug
# (bindgen does not emit `max_align_t`). We call the `mupdf_*` convenience API
# via src/pdf_native.rs.
mupdf-sys = "0.8.0"
# 聚合邮箱：邮件解析（mailparse）+ IMAP 拉取。
# IMAP 用 async-imap（契合 app 已是 tokio；支持后续 IDLE/推送），TLS 走 tokio-native-tls（Windows Schannel）。
mailparse = "0.15"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
encoding_rs = "0.8"
tauri-plugin-http = "2"

[dev-dependencies]
# For async integration tests (embed_text network round-trip / search_semantic ranking).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Android 专属：native-tls 在 Android 上映射到 OpenSSL（桌面 Windows 走 Schannel 不受影响），
# 交叉编译需要一个 Android 版 OpenSSL。这里用 vendored 从源码构建（借助 NDK 的 clang + Perl），
# 从而不改动 native-tls 的调用代码，各平台行为一致。仅 Android 生效，桌面/Web 构建不受影响。
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
# SQLCipher 在 Android 上同样依赖 OpenSSL。启用 libsqlite3-sys 官方提供的
# vendored-openssl 变体，让它复用上面这份从源码构建的 OpenSSL
# （它经 openssl-sys 的 DEP_OPENSSL_INCLUDE 取得头文件，并静态链接 libcrypto）。
# features 是可累加的，故这里与 [dependencies] 中的声明合并后仅对 Android 生效。
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
