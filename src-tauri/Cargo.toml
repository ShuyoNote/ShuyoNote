[package]
name = "shuyonote"
version = "1.82.6"
description = "A local-first Notion-like note app"
authors = ["you"]
edition = "2021"
# MSRV锛堟渶灏忔敮鎸佺増鏈級锛氫笌鏂囨。澹版槑鐨?"1.94+" 瀵归綈锛涗笉閿佸伐鍏烽摼锛屼粎澹版槑鏈€浣?Rust 鐗堟湰銆?# 鑻ヨ鏇翠弗鏍煎鐜帮紝鍙彟鍔?rust-toolchain.toml 閽?channel锛堥粯璁や笉閽夛紝璺熼殢 stable锛夈€?rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shuyonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha2 = "0.11"
regex = "1"
zip = "8"
boa_engine = "0.21.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.5.3"
# rand_core stays on 0.6: the crypto tree (chacha20poly1305 0.11 / argon2 0.5)
# is already at latest and pins rand_core 0.6; lifting it forges a second
# RngCore trait and breaks OsRng usage.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23.1"
percent-encoding = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "2"
# M24 desktop-native PDF render: use mupdf-sys (compiles cleanly on MSVC) rather
# than the high-level `mupdf` crate, whose safe wrapper has an MSVC compile bug
# (bindgen does not emit `max_align_t`). We call the `mupdf_*` convenience API
# via src/pdf_native.rs.
mupdf-sys = "0.8.0"

[dev-dependencies]
# For async integration tests (embed_text network round-trip / search_semantic ranking).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
