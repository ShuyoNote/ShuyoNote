[package]
name = "shuyonote"
version = "2.0.0"
description = "A local-first Notion-like note app"
authors = ["you"]
edition = "2021"
# MSRV（最低支持版本）：与文档声明的 "1.94+" 对齐；不锁工具链，跟随 stable，仅声明最低 Rust 版本。如需更严格环境可另加 rust-toolchain.toml 锁 channel（默认不锁）。
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shuyonote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MCP 桥（Rust 版）**不在这个包里**：它是独立 crate `tools/shuyonote-mcp-rust/`。
# 原因：tauri-build 在编译期就校验 `bundle.resources` 里的路径存在，而桥产物正是编译期才生成的
# （放这里 ⇒ `cargo build` 直接红 `resource path … doesn't exist`）。
# 构建：`node scripts/build-mcp-bridge.mjs`，已挂到 tauri.conf 的 beforeDev/BuildCommand。

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `build.rs` 要把**被检查的那份 SQLCipher 源码**的 sha256 写进产物标记（见 `build.rs` 里"新鲜度"那段注释）。
# 版本取 Cargo.lock 里已有的 0.10（不引入新下载）；**不手写哈希** —— 自己实现的 crypto 不该进构建链。
sha2 = "0.10"

# ── 国密（SM 系列）主线开关（方案 §0-E）────────────────────────────────────────────────
#
# **默认关闭**：官方默认包不含国密，外部贡献者的前置（Tongsuo/Perl 构建链）不变；国密版另发。
#
# 这一版只覆盖**应用层 AEAD**（P1）：SM4-CBC ＋ HMAC-SM3（EtM），实现来源 = RustCrypto（§0-F，
# 纯 Rust ⇒ 全平台同一份实现，不被 Tongsuo 的 C 构建链阻塞）。
# **库级**（SQLCipher 页加密 / 页 HMAC，P2-P3）走 Tongsuo，不吃这个 feature —— 两条线各自独立。
[features]
# ★ 2026-09-20 owner 拍板「无兼容快路」后**默认打开应用层国密**：
#   从"默认构建写 v1 / 国密构建写 v2"变成"**只有一个写路径：v2（SM4-CBC ＋ HMAC-SM3）**"，
#   v0/v1 保留**只读**（最便宜的回退网，见方案 §3.4）。
#   它是**纯 Rust**（RustCrypto）⇒ 全平台同一份实现、**不吃构建链**（与库级 `sm-library` 不同）。
#   要回到旧行为：`cargo … --no-default-features`（或把这行改回 `default = []`）——一行可逆。
default = ["sm-crypto"]
sm-crypto = ["dep:sm4", "dep:cbc", "dep:sm3", "dep:hmac", "dep:pbkdf2"]
# 库级国密（P2/P3 的**构建侧接缝**）：SQLCipher 的页加密 / 页 HMAC / 库 KDF 要换成国密，
# 前提是**编进去的后端**是 Tongsuo/OpenSSL 而不是 Apple 的 CommonCrypto（后者只有 AES，方案 §3 第 5 条）。
# 打开它 ⇒ `build.rs` 强制要求显式 `OPENSSL_DIR`（否则**当场失败**，不静默编出一个没有国密的库）；
# 事后由门禁 `check-crypto-backend` 拿产物核对。provider 补丁本身属 AMD（P2/P3）。
sm-library = []

# ★ 2026-09-21：MuPDF 变成**构建期特性**，默认**不编**（owner 拍板"保留退路的折中"）。
#   背景：PDFium 从 1.91.13 起就是默认引擎（`PdfEngine::DEFAULT = Pdfium`），MuPDF 只剩
#   `SHUYONOTE_PDF_ENGINE=mupdf` 这条"一键回滚"。它是个重量级 C 依赖（构建产物里
#   `libmupdf.lib` 633 MB、进包还要占若干 MB），而**绝大多数构建根本用不到它**。
#   所以：平时不编（省构建时间/体积），要留退路时**显式重编一次**：
#     cargo build --release --features mupdf-rollback      # 桌面
#     pnpm tauri build --features mupdf-rollback           # 走 CLI（透传给 cargo）
#   ⚠️ 没编这个 feature 的构建里，`SHUYONOTE_PDF_ENGINE=mupdf` **不会静默换成 PDFium**：
#   它会回一句"这个构建没编入 MuPDF，请用带 mupdf-rollback 的构建"（判据守着，见 commands.rs）。
mupdf-rollback = ["dep:mupdf-sys"]

# ⭐ 2026-10-25（跨网中继「数据面」Step 2a · **owner 已拍**）：
#   **`iroh` 只在 `--features relay` 里带，默认不带** ⇒ 默认产物的体积/编译时间一个字不变。
#   为什么需要它：今天 `Cargo.lock` 里只有 `iroh-relay`/`iroh-base`/`iroh-dns`
#   （那是"中继服务器协议 ＋ 基础类型"），**它们不能自己收发数据** ⇒ 隧道要 `iroh` 的 `Endpoint`
#   （QUIC ＋ 打洞）。方案：`docs/plans/2026-10-25-relay-data-plane-minimal-plan.md` §五 ①。
#   ⚠️ 判据（默认不该带）：`cargo tree -e normal` 里**没有** `iroh v…`
#   ＋ 默认构建的测试 `the_relay_data_plane_is_off_by_default` 断言 `cfg!(feature = "relay")` 为假。
relay = ["dep:iroh"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ⭐ 2026-10-11：⭐ 许可证验签（`src/relay_license.rs`）✗ —— ⚠️ 它**已经在 `Cargo.lock` 里**
#    （3.0.0，由 `iroh` 那条链带进来）⇒ 这里只是把它提成直接依赖，⛔ 不需要拉网络 ✓。
ed25519-dalek = "3"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
# 查询侧归一化（§15.9）：只折「兼容表意字」用的 NFKC 数据。
# ⚠️ 它**已经在 Cargo.lock 里**（2.0.1，由 idna/url 那条链带进来）⇒ 这里只是把它提成直接依赖，
#    没有新增下载、也没有多一份数据表。选它而不是 unicode-normalization：后者本仓 lock 里没有。
icu_normalizer = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha2 = "0.11"
regex = "1"
zip = "8"
# 解压"能力包"里的 gzip 词库（owner 2026-10-10 拍「Rust 侧下载」；⛔ 不走 webview 的 base64-IPC）。
# ⚠️ **不新增任何下载**：flate2 **早就在 `Cargo.lock` 里**（1.1.10，随 `zip` 进来）⇒ 这里只是**提成直接依赖**
#    （Rust 里 `use flate2::…` 必须先声明，否则编不过）。许可 MIT/Apache-2.0 双许可，与 AGPL 客户端兼容。
flate2 = "1"
hex = "0.4"
# ── P0 格式引擎（2026-10-02）────────────────────────────────────────────────────────
# 许可：**只允许 v4.10.x**（crates.io 逐字 `"license":"MIT"` ✓ ⇒ 可进 AGPL-3.0 客户端 ✓）。
#       ⛔ v5／Xberg 是 **Elastic-2.0** ✗ ⇒ 与 AGPL 不兼容 ⇒ **永不引入** ✗。版本**钉死** =4.10.4。
# 特性：**故意不含** `chunking` —— 它拉 text-splitter → icu_segmenter 2.3.0，
#       而本仓 boa_engine → icu_normalizer 2.0.1 → icu_collections ~2.0.0 ⇒ **cargo 无解** ✗（实测）。
#       ⭐ 而且分块本来就归本仓 `src/lib/extract/chunk.ts` ✓，不在这一层做 ✓。
#       ⛔ 也不含 pdf（构建期会去 github.com 下 pdfium ✗ 本机该域被 DNS 劫持 ✓）
#       ⛔ 也不含 ocr/paddle-ocr/layout-detection/embeddings（要 ort/ONNX ✗，且本仓已有 tesseract ✓）。
# ⚠️ **不写 `default-features = false`**：与我实测编过的那份探针配置**逐字一致** ✓
#    （当时 393 依赖 / 132k 行编过 ✓），免得为一个没核过的特性名再赌一次 ✗。
kreuzberg = { version = "=4.10.4", features = [
  "office", "excel", "email", "archives", "html", "xml",
  "quality", "language-detection",
] }
# 索引签名（minisign）：与 updater 同一套习惯，只做校验（不内置任何"官方公钥"）。
minisign-verify = "0.2"
# RSS 看门狗读子进程常驻内存：Linux 要页大小（sysconf），macOS 走 proc_pidinfo。
# 它本来就在依赖树里（随 rusqlite/tokio 进来），这里只是显式声明。
libc = "0.2"
# ⭐ **D1（owner 2026-09-30）「地址自动」**：绑了通配（`0.0.0.0`）之后要**枚举本机地址**，
# 才知道该往公告里写哪个（＝别人拉得到的那一个）。枚举要两个**平台 API ＋ 链表遍历**：
# POSIX 的 `getifaddrs(3)` ／ Windows 的 `GetAdaptersAddresses`。
#
# ⚠️ **为什么这次破例引一个新包**（上面 `disk.rs` 那段写的是"只为**一次系统调用**引新包不划算"）：
#   ① 那条规矩的形状是"**一次**系统调用"（`statvfs` / `GetDiskFreeSpaceExW`），而这里是
#      **两套平台 API ＋ 指针链表遍历**（自己写 ≈120 行 `unsafe`，其中 **Windows 那一半
#      在 macOS 上根本编不了** ⇒ 等于往 CI 里塞一段本机无法验证的 unsafe）；
#   ② `if-addrs` 的依赖**只有 `libc` ＋ `windows-sys`** —— **两个都已经在本仓 lockfile 里**
#      （就是 `disk.rs` 用的那两个）⇒ **不新增任何传递依赖**，只是把它们包成一个薄封装；
#   ③ 维护活跃（0.15.0 ＝ 2026-02-08；0.14.0 ＝ 2025-07），许可宽松（MIT OR BSD-3-Clause），
#      上游 CI 覆盖 posix（含 apple/android）＋ windows；
#   ④ `rust-version` 未声明（crate 无 MSRV 声明）⇒ 由**本仓**的构建证明（MSRV 1.94 声明在 `Cargo.toml` 顶部）。
# ⚠️ 默认**不**返回链路本地地址（它的 `link-local` feature 默认关）—— 与本仓"报一个对端能用的地址"
#    一致（169.254 只在一条链上有效）。取舍与判据见 `src/mesh.rs::announced_bases_with`。
if-addrs = "0.15"
# 插件 JS 运行时。⚠️ **移动端必须额外开 `jsvalue-enum`**——理由见下面
# [target.'cfg(any(target_os = "android", target_os = "ios"))'] 那段（真机实测的 panic）。
boa_engine = "0.21.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.5.3"
# rand_core stays on 0.6: the crypto tree (chacha20poly1305 0.11 / argon2 0.5)
# is already at latest and pins rand_core 0.6; lifting it forges a second
# RngCore trait and breaks OsRng usage.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23.1"
# 国密原语（P1 应用层 AEAD）。四条都在 RustCrypto，版本对齐 digest 0.11；
# ★ 2026-09-20 起 `sm-crypto` 是**默认特性**（方案 §3.4），只有 `--no-default-features`（回滚通道）才不编。
# ⇒ **与仓里已有的 hmac 0.13 / cipher 0.5.2 / pbkdf2 0.13 是同一代**（`Cargo.lock` 里本来就有它们，
# 只是此前作为传递依赖；这里提成**可选**直接依赖，不开 feature 时一个新包都不编）。
# ⚠️ API 口径踩过坑，别照抄旧文档：`cbc 0.2` 的带填充辅助方法是
#    `encrypt_padded_vec::<P>()` / `decrypt_padded_vec::<P>()`（**没有 `_mut`**），且分别在
#    `BlockModeEncrypt` / `BlockModeDecrypt` 两个 trait 上；`new_from_slice` 在 **`KeyInit`** 上。
sm4 = { version = "0.6", optional = true }
cbc = { version = "0.2", features = ["alloc", "block-padding"], optional = true }
sm3 = { version = "0.5", optional = true }
hmac = { version = "0.13", optional = true }
pbkdf2 = { version = "0.13", optional = true }
percent-encoding = "2"
tauri-plugin-updater = "=2.10.1"
# 交付通道协议 `shuyonote://`：只做 **OS 层**（注册 scheme / 唤起 / 把整条 URL 交给应用），
# 语义解析在 src/lib/deepLink.ts（纯函数，不在 Rust 侧重复一遍）。
tauri-plugin-deep-link = "2"
# 关键：`deep-link` feature 必须开。Windows 上系统是「新起一个进程、URL 作为唯一命令行参数」，
# 没有这个 feature，single-instance 会在第二个进程里直接退出、URL 被丢掉——表现就是
# 「应用已在运行时再点一次没有任何反应」。开了之后回调里会先把 argv 喂给 deep-link，
# 由它解析并 emit `deep-link://new-url`，然后才走我们自己的「还原窗口 + 抢焦点」。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# M24 desktop-native PDF render: use mupdf-sys (compiles cleanly on MSVC) rather
# than the high-level `mupdf` crate, whose safe wrapper has an MSVC compile bug
# (bindgen does not emit `max_align_t`). We call the `mupdf_*` convenience API
# via src/pdf_native.rs.
# ⚠️ 2026-09-21 起它是**可选依赖**：只有 `--features mupdf-rollback` 才编（见 [features] 那段）。
mupdf-sys = { version = "0.8.0", optional = true }
# PDFium（P1，2026-09-17 开工）：**只做光栅化的替换**，MuPDF 路径保留（P2 才按运行时开关分派）。
# 选 `pdfium-render` 而不是自己 FFI 的理由（spike 实测，见 docs/plans/2026-09-16-pdfium-engine-plan.md §0）：
# 它用**预生成绑定 ＋ libloading 动态加载**，构建期不跑 bindgen ⇒ 不会重演上面 mupdf 那个 `max_align_t` 坑。
# ⚠️ `pdfium_7881` 要**显式钉住**（不跟 `pdfium_latest`）：库与绑定的版本必须锁死，避免漂移。
# `thread_safe` 让我们可以在全局 Mutex 下跨线程用同一个 Pdfium 实例。
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# ⚠️ 2026-10-30：**关掉 cookies 特性** —— 插件 init 会 `app_cache_dir()` + `create_dir_all` +
#   打开 `<cache>/.cookies`；本机在该路径上稳定报 `PluginInitialization("http", 拒绝访问 os error 5)`
#   ⇒ 整个应用起不来。我们不使用插件的 cookie 罐（社区发布那处 cookie 走的是自己的 reqwest），
#   关掉后 init 不再碰文件系统（剩下纯注册），先恢复"能启动"；要恢复插件 cookie 能力需另查该目录 ACL。
tauri-plugin-http = { version = "2", default-features = false }
# fs 插件：**不是给前端用的**（capabilities 里没授它权限），而是给 `picked_file` 用——
# Android 的系统选择器返回 `content://` URI，`std::fs` 打不开，只有它的 `Fs::open` 能开
# （Android 经 Kotlin 的 ContentResolver 取 fd；桌面就是 `std::fs::OpenOptions`，等价）。
tauri-plugin-fs = "2"
fast_qr = { version = "0.14.0", default-features = false, features = ["svg"] }

# ── 跨网中继（relay）客户端（2026-10-09，第 1 期：连接 ＋ 握手 ＋ 许可窗口判定）────────
# `src-tauri/src/relay_client.rs` 要谈的是**上游 iroh-relay 的客户端协议**：
# 中继组件（repos/shuyonote-relay，专有）是上游 iroh-relay 的薄封装，握手是上游的
# **质询-应答**（服务端发质询、客户端用私钥签回 ⇒ 身份由握手证明 ⇒ 服务端**不信**客户端自报的任何字段），
# 所以客户端这一侧只有上游那个 client 实现认得它 —— ⛔ 自己重写一遍握手 = 造第二份协议 ✗。
# 许可：上游 MIT OR Apache-2.0 ✓（与客户端 AGPL-3.0 兼容 ✓）；版本**钉死** =1.3.0：
# 中继仓 `Cargo.toml` 也钉在同一版，两端漂移会直接表现为版本头对不上 ⇒ 握手失败 ✓。
# ⚠️ 只要客户端这一半：⛔ 不开 `server` feature ✗（那是中继服务端的编法）。
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.3.0", default-features = false, features = ["key", "relay"] }
# 上游 `ClientBuilder::new` 的第三个参数就是 `DnsResolver`（拿不到它就没法连）；
# ⚠️ 我们只支持 `http://IP:端口` 这类地址，它**不做域名解析** ✓（本机／局域网中继场景）。
iroh-dns = "=1.3.0"

# ⭐ 2026-10-25（数据面 Step 2a）：**端点**（QUIC ＋ 打洞 ＋ 中继隧道）—— ⚠️ **optional**：
#   只有 `--features relay` 才会把它拉进依赖树 ⇒ 默认构建不受影响（owner 2026-10-25 拍 ✓）。
#   版本与 `iroh-relay` 钉同一版（=1.3.0）：两端漂移会表现为版本头对不上 ⇒ 隧道建不起来。
#   ⚠️ 默认特性**关掉**：`iroh` 默认会把 metrics/浏览器那几套一起带进来；我们只要端点本体。
#     需要什么再加什么（Step 2b 落地时以「编得过 ＋ 判据绿」为准，⛔ 不提前开）。
iroh = { version = "=1.3.0", optional = true, default-features = false, features = ["tls-ring"] }

# 聚合邮箱（**桌面专属**，2026-09-13 定）：邮件解析（mailparse）+ IMAP 拉取
# （async-imap，契合 app 已是 tokio），TLS 走 tokio-native-tls（桌面走系统 TLS：
# Windows Schannel / macOS Security.framework / Linux OpenSSL）。
#
# **移动端不提供该功能**，所以这一组连同 `email` / `smtp` 模块一起收窄到桌面（见下）。
# 收窄的直接收益：移动端不再需要 `native-tls`，也就不再需要为它单独引一份 OpenSSL。
#
# ⚠️ **但它不等于"移动端不用编译 OpenSSL"**（这条我先前判断错过一次）：SQLCipher 仍然
# 需要一个加密后端，而 Android 侧用的是 libsqlite3-sys 的 vendored-openssl，仍要从源码构建
# OpenSSL。见下面 [target.'cfg(target_os = "android")'] 那段。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mailparse = "0.15"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
encoding_rs = "0.8"

[dev-dependencies]
# For async integration tests (embed_text network round-trip / search_semantic ranking).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# C1 预算刹车的**硬性磁盘余量闸门**要问"这个卷还剩多少"：`std` 没有这个 API，
# 而 `sysinfo` / `fs4` / `fs2` **都不在依赖树里**（查过 Cargo.lock）⇒ 引一个只为
# 一次系统调用而存在的新包不划算。`windows-sys` 本来就在 lockfile 里
# （随 tauri/tokio 进来，见 `0.61.2`），这里只是**显式声明**并用它调
# `GetDiskFreeSpaceExW`；Unix/Android 那一侧用同样已在依赖树里的 `libc`（`statvfs`）。
# 实现与取舍见 `src/disk.rs`。
[target.'cfg(target_os = "macos")'.dependencies]
# 只用来 `msg_send!` 把系统那三颗红绿灯 `setHidden:`（自绘小灯替换，见 src/mac_lights.rs）。
# 版本取 Cargo.lock 里已有的 0.6（随 tauri/tao 进来）⇒ 不引入新的下载。
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Android 专属：**SQLCipher 需要一个加密后端**，这里用 libsqlite3-sys 官方提供的
# vendored-openssl 变体，从源码构建 OpenSSL（借助 NDK 的 clang + Perl），并静态链接 libcrypto。
# features 是可累加的，故这里与 [dependencies] 中的声明合并后仅对 Android 生效。
#
# ⚠️ 这份 OpenSSL **仍然必需**：邮箱已经收窄为桌面专属，但 SQLCipher 还是靠它。
# 所以「移动端不做邮箱 ⇒ 不用编译 OpenSSL」是错的（我先前就是这么判断错的）。
# 它的构建需要一个 **MSYS 类**的 Perl（原生 Windows Perl 会被 OpenSSL 的 Configure 拒绝），
# 详见 私有仓库 `shuyonote-sync-server` 的 `docs/android-launch-plan.md` §0.0。
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

# Android 上 **TLS 信任链交给系统证书库**，而这件事需要我们自己插一脚：
# reqwest 0.13 在 Android 上默认用 `rustls-platform-verifier`，它**必须在第一次 HTTPS
# 请求之前**被初始化，否则进程直接 panic（真机 logcat 原话）：
#   E/RustStdoutStderr: Expect rustls-platform-verifier to be initialized
# 初始化点在 src/tls_android.rs（由 setup 调一次）。
#
# 为什么需要**直接**依赖它，而不是只把它当 reqwest 的传递依赖：我们要调它的
# `android::init_with_env`，那个函数的参数类型来自**它自己那份 jni 0.22.4**。
# ⚠️ 而 wry 0.55.1 用的是 **jni 0.21.1**——两版类型不能互换（连 `JavaVM::singleton()`
# 都不共享，jni 0.22 的文档专门警告过）。所以这里也直接引 jni 0.22，两边用**裸指针**
# 对接：`JavaVM::from_raw` / `JObject::from_raw` 都是 jni 文档化的 unsafe 构造器，
# **不是**按结构体布局硬转。取证过程与备选方案见 docs/MOBILE.md §2.4。
rustls-platform-verifier = "0.7"
jni = "0.22"

# 局域网发现（甲-1）：Android 要收 **UDP 广播/组播** 必须先拿一把 `WifiManager.MulticastLock`，
# 而那条调用要**带参数**（`getSystemService("wifi")`、`createMulticastLock(tag)`）⇒ 需要 jni 0.21 的
# `JValue`（`tls_android.rs` 那一路只传过空参数，所以此前没暴露这个需要）。
#
# ⚠️ 为什么要**改名**引第二份 jni：wry 0.55.1 用的是 jni **0.21.1**，而上面那行（给
# `rustls-platform-verifier` 用的）是 **0.22.4** —— 两版**类型不能互换**。`jni_handle().exec`
# 给我们的 `&mut JNIEnv` 是 0.21 那一份，所以 `JValue` 也必须取 0.21 那一份；两份共存靠
# `package = "jni"` 别名（Cargo 允许同名包的不同大版本共存，Cargo.lock 里本来就有这两条）。
jni021 = { package = "jni", version = "0.21" }

# 移动端专属（iOS 一并开着，同一个理由）：boa 的 **nan-boxing 在 Android 上不成立**
# ——2026-09-13 真机实测（HUAWEI Mate 40 / Android 12）。它的 `tag_pointer()` 断言指针必须
# 落在 `MASK_POINTER_VALUE`（低 48 位）内，而真机上拿到的是 **0xB400007D1B960000**
# （真实地址 0x7D1B960000）——**最高字节被当 tag 用了**，断言当场失败：
#
#   thread 'plugin-run' panicked at boa_engine-0.21.1/src/value/inner/nan_boxed.rs:270:9:
#   assertion `left == right` failed: this platform is not compatible with a nan-boxed `JsValueInner`
#
# 表现：**应用不崩**（panic 在插件线程上，主线程照常跑），但**插件整个用不了**。
# boa 自己给的逃生口就是 `jsvalue-enum`：改用枚举版 `JsValueInner`，不做指针标记。
# 代价：`JsValue` 从 8 字节 nan-boxed 变成枚举（更大更慢）——桌面 x64 用户态指针高位为 0、
# 不受影响，所以**只对移动端开**。features 可累加：这里与 [dependencies] 的声明合并，
# 且仅对移动端生效（与上面 rusqlite 那段同一个机制）。详见 docs/MOBILE.md §2.1。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
boa_engine = { version = "0.21.1", features = ["jsvalue-enum"] }

# 体积（2026-09-13，为 Android 上线而加；实测依据见
# 私有仓库 `shuyonote-sync-server` 的 `docs/android-launch-plan.md` §3）：
#   · `.debug_*` 段**一个都没有**（实测 0 个）——原来就没有调试信息，所以 strip 省的不是它；
#   · strip 真正去掉的是 `.symtab` + `.strtab`：arm64 的 .so **101.2 → 88.4 MiB（−12.7 MiB / −12.6%）**。
#
# ⚠️ 代价：**丢掉符号名**，真机原生崩溃只能看到地址。需要符号化时用环境变量临时关掉即可，
#    不必改这个文件（Cargo 认 `CARGO_PROFILE_<name>_<key>` 这种覆盖）：
#      $env:CARGO_PROFILE_RELEASE_STRIP = "false"; pnpm tauri android build
#    想长期两全，就让 CI 额外产出一份带符号的 .so 当构建附件（本轮没做）。
[profile.release]
strip = true

# ⭐ iOS：`n0-dns-resolver 0.1.0` 用 `target_vendor = "apple"` 收了 `apple.rs`（只该给 macOS）
#   ⇒ iOS 链接时缺 `_kSCDynamicStoreUseSessionKeys` ✗ ⇒ 用 vendored 版把 cfg 收窄到 macOS、iOS 走 unix ✓
#   ⚠️ 上游修好后可删掉这一节与 `vendor/` 目录 ✓（见 vendor/n0-dns-resolver/PATCH-NOTE.md）
[patch.crates-io]
n0-dns-resolver = { path = "vendor/n0-dns-resolver" }
